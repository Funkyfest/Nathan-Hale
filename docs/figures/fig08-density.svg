<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="IBM Plex Sans, Arial, Helvetica, sans-serif"><rect width="1200" height="560" fill="#ffffff"/><text x="24" y="34" fill="#1b2430" font-size="19" font-weight="700">Rack power density, 2016–2028</text><text x="24" y="54" fill="#5b6675" font-size="12.5">AI racks went from ordinary to roughly ten times a cloud rack in eight years.</text><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbe3e2"/><line x1="0" y1="0" x2="0" y2="7" stroke="#d64541" stroke-width="2"/></pattern></defs><line x1="110" y1="446.7" x2="1150" y2="446.7" stroke="#c4ccd6" stroke-dasharray="3,4"/><text x="100" y="450.7" text-anchor="end" fill="#5b6675" font-size="12">3 kW</text><line x1="110" y1="377.6" x2="1150" y2="377.6" stroke="#c4ccd6" stroke-dasharray="3,4"/><text x="100" y="381.6" text-anchor="end" fill="#5b6675" font-size="12">10 kW</text><line x1="110" y1="314.6" x2="1150" y2="314.6" stroke="#c4ccd6" stroke-dasharray="3,4"/><text x="100" y="318.6" text-anchor="end" fill="#5b6675" font-size="12">30 kW</text><line x1="110" y1="245.4" x2="1150" y2="245.4" stroke="#c4ccd6" stroke-dasharray="3,4"/><text x="100" y="249.4" text-anchor="end" fill="#5b6675" font-size="12">100 kW</text><line x1="110" y1="182.4" x2="1150" y2="182.4" stroke="#c4ccd6" stroke-dasharray="3,4"/><text x="100" y="186.4" text-anchor="end" fill="#5b6675" font-size="12">300 kW</text><line x1="110" y1="113.3" x2="1150" y2="113.3" stroke="#c4ccd6" stroke-dasharray="3,4"/><text x="100" y="117.3" text-anchor="end" fill="#5b6675" font-size="12">1 MW</text><line x1="110" y1="470" x2="1150" y2="470" stroke="#1b2430"/><line x1="110" y1="470" x2="110" y2="90" stroke="#1b2430"/><rect x="111" y="291.3" width="1039" height="23.3" fill="#f6e7c8" opacity="0.7"/><text x="120" y="285.3" fill="#8a6513" font-size="11.5" font-weight="600">practical limit of air cooling ≈ 30–45 kW per rack</text><text x="170.0" y="492" text-anchor="middle" fill="#1b2430" font-size="12">2016</text><rect x="134.0" y="406.9" width="34" height="63.1" fill="#2f6fd6"/><text x="151.0" y="400.9" text-anchor="middle" fill="#2f6fd6" font-size="11">6</text><rect x="172.0" y="362.6" width="34" height="107.4" fill="#d64541" stroke="#d64541" stroke-width="0"/><text x="189.0" y="342.6" text-anchor="middle" fill="#d64541" font-size="11.5" font-weight="700">13</text><text x="189.0" y="356.6" text-anchor="middle" fill="#5b6675" font-size="10">DGX-1</text><text x="323.3" y="492" text-anchor="middle" fill="#1b2430" font-size="12">2018</text><rect x="287.3" y="398.1" width="34" height="71.9" fill="#2f6fd6"/><text x="304.3" y="392.1" text-anchor="middle" fill="#2f6fd6" font-size="11">7</text><rect x="325.3" y="327.4" width="34" height="142.6" fill="#d64541" stroke="#d64541" stroke-width="0"/><text x="342.3" y="307.4" text-anchor="middle" fill="#d64541" font-size="11.5" font-weight="700">24</text><text x="342.3" y="321.4" text-anchor="middle" fill="#5b6675" font-size="10">DGX-2</text><text x="476.7" y="492" text-anchor="middle" fill="#1b2430" font-size="12">2020</text><rect x="440.7" y="390.4" width="34" height="79.6" fill="#2f6fd6"/><text x="457.7" y="384.4" text-anchor="middle" fill="#2f6fd6" font-size="11">8</text><rect x="478.7" y="322.8" width="34" height="147.2" fill="#d64541" stroke="#d64541" stroke-width="0"/><text x="495.7" y="302.8" text-anchor="middle" fill="#d64541" font-size="11.5" font-weight="700">26</text><text x="495.7" y="316.8" text-anchor="middle" fill="#5b6675" font-size="10">DGX A100</text><text x="630.0" y="492" text-anchor="middle" fill="#1b2430" font-size="12">2022</text><rect x="594.0" y="377.6" width="34" height="92.4" fill="#2f6fd6"/><text x="611.0" y="371.6" text-anchor="middle" fill="#2f6fd6" font-size="11">10</text><rect x="632.0" y="296.6" width="34" height="173.4" fill="#d64541" stroke="#d64541" stroke-width="0"/><text x="649.0" y="276.6" text-anchor="middle" fill="#d64541" font-size="11.5" font-weight="700">41</text><text x="649.0" y="290.6" text-anchor="middle" fill="#5b6675" font-size="10">DGX H100</text><text x="783.3" y="492" text-anchor="middle" fill="#1b2430" font-size="12">2024</text><rect x="747.3" y="367.2" width="34" height="102.8" fill="#2f6fd6"/><text x="764.3" y="361.2" text-anchor="middle" fill="#2f6fd6" font-size="11">12</text><rect x="785.3" y="229.5" width="34" height="240.5" fill="#d64541" stroke="#d64541" stroke-width="0"/><text x="802.3" y="209.5" text-anchor="middle" fill="#d64541" font-size="11.5" font-weight="700">132</text><text x="802.3" y="223.5" text-anchor="middle" fill="#5b6675" font-size="10">GB200 NVL72</text><text x="936.7" y="492" text-anchor="middle" fill="#1b2430" font-size="12">2026</text><rect x="900.7" y="354.3" width="34" height="115.7" fill="#2f6fd6"/><text x="917.7" y="348.3" text-anchor="middle" fill="#2f6fd6" font-size="11">15</text><rect x="938.7" y="208.6" width="34" height="261.4" fill="url(#hatch)" stroke="#d64541" stroke-width="1.5"/><text x="955.7" y="188.6" text-anchor="middle" fill="#d64541" font-size="11.5" font-weight="700">190</text><text x="955.7" y="202.6" text-anchor="middle" fill="#5b6675" font-size="10">est. next gen</text><text x="1090.0" y="492" text-anchor="middle" fill="#1b2430" font-size="12">2028</text><rect x="1054.0" y="343.9" width="34" height="126.1" fill="#2f6fd6"/><text x="1071.0" y="337.9" text-anchor="middle" fill="#2f6fd6" font-size="11">18</text><rect x="1092.0" y="142.6" width="34" height="327.4" fill="url(#hatch)" stroke="#d64541" stroke-width="1.5"/><text x="1109.0" y="122.6" text-anchor="middle" fill="#d64541" font-size="11.5" font-weight="700">600</text><text x="1109.0" y="136.6" text-anchor="middle" fill="#5b6675" font-size="10">announced target</text><rect x="124" y="98" width="14" height="12" fill="#2f6fd6"/><text x="144" y="109" fill="#1b2430" font-size="12">Typical cloud / enterprise rack</text><rect x="370" y="98" width="14" height="12" fill="#d64541"/><text x="390" y="109" fill="#1b2430" font-size="12">NVIDIA reference AI rack</text><rect x="580" y="98" width="14" height="12" fill="url(#hatch)" stroke="#d64541"/><text x="600" y="109" fill="#1b2430" font-size="12">projected / announced</text><text x="24" y="540" fill="#5b6675" font-size="11">Log scale: each gridline is roughly ×3. AI values are per-rack figures for NVIDIA reference systems (DGX racks assume 4 systems per rack). 2026–28 are estimates and vendor targets.</text></svg>