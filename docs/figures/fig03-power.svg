<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="IBM Plex Sans, Arial, Helvetica, sans-serif"><rect width="1200" height="600" fill="#ffffff"/><text x="24" y="34" fill="#1b2430" font-size="19" font-weight="700">Power path — from the transmission line to the chip</text><text x="24" y="54" fill="#5b6675" font-size="12.5">Each stage steps voltage down; the A and B paths never share a component until they meet inside the rack.</text><defs><marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker><marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64541"/></marker><marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/></marker><marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99a1e"/></marker></defs><rect x="24" y="110" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#d64541" stroke-width="1.6"/><text x="94.0" y="134.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Utility feed A</text><text x="94.0" y="150.0" text-anchor="middle" fill="#5b6675" font-size="11">230 kV</text><rect x="180" y="110" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#d64541" stroke-width="1.6"/><text x="250.0" y="134.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Main transformer A</text><text x="250.0" y="150.0" text-anchor="middle" fill="#5b6675" font-size="11">230 → 34.5 kV</text><path d="M164,138.0 L180,138.0" fill="none" stroke="#d64541" stroke-width="2.6"/><rect x="336" y="110" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#d64541" stroke-width="1.6"/><text x="406.0" y="134.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">MV switchgear A</text><text x="406.0" y="150.0" text-anchor="middle" fill="#5b6675" font-size="11">34.5 kV</text><path d="M320,138.0 L336,138.0" fill="none" stroke="#d64541" stroke-width="2.6"/><rect x="492" y="110" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#d64541" stroke-width="1.6"/><text x="562.0" y="134.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Unit substation A</text><text x="562.0" y="150.0" text-anchor="middle" fill="#5b6675" font-size="11">34.5 kV → 480 V</text><path d="M476,138.0 L492,138.0" fill="none" stroke="#d64541" stroke-width="2.6"/><rect x="648" y="110" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#d64541" stroke-width="1.6"/><text x="718.0" y="134.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">LV switchboard A</text><text x="718.0" y="150.0" text-anchor="middle" fill="#5b6675" font-size="11">480 V</text><path d="M632,138.0 L648,138.0" fill="none" stroke="#d64541" stroke-width="2.6"/><rect x="804" y="110" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#d64541" stroke-width="1.6"/><text x="874.0" y="134.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">UPS + batteries A</text><text x="874.0" y="150.0" text-anchor="middle" fill="#5b6675" font-size="11">~5 min ride-through</text><path d="M788,138.0 L804,138.0" fill="none" stroke="#d64541" stroke-width="2.6"/><path d="M944,138.0 L965,138.0 L965,269 L990,269" fill="none" stroke="#d64541" stroke-width="2.6" marker-end="url(#aRed)"/><rect x="24" y="400" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#2f6fd6" stroke-width="1.6"/><text x="94.0" y="424.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Utility feed B</text><text x="94.0" y="440.0" text-anchor="middle" fill="#5b6675" font-size="11">230 kV</text><rect x="180" y="400" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#2f6fd6" stroke-width="1.6"/><text x="250.0" y="424.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Main transformer B</text><text x="250.0" y="440.0" text-anchor="middle" fill="#5b6675" font-size="11">230 → 34.5 kV</text><path d="M164,428.0 L180,428.0" fill="none" stroke="#2f6fd6" stroke-width="2.6"/><rect x="336" y="400" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#2f6fd6" stroke-width="1.6"/><text x="406.0" y="424.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">MV switchgear B</text><text x="406.0" y="440.0" text-anchor="middle" fill="#5b6675" font-size="11">34.5 kV</text><path d="M320,428.0 L336,428.0" fill="none" stroke="#2f6fd6" stroke-width="2.6"/><rect x="492" y="400" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#2f6fd6" stroke-width="1.6"/><text x="562.0" y="424.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Unit substation B</text><text x="562.0" y="440.0" text-anchor="middle" fill="#5b6675" font-size="11">34.5 kV → 480 V</text><path d="M476,428.0 L492,428.0" fill="none" stroke="#2f6fd6" stroke-width="2.6"/><rect x="648" y="400" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#2f6fd6" stroke-width="1.6"/><text x="718.0" y="424.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">LV switchboard B</text><text x="718.0" y="440.0" text-anchor="middle" fill="#5b6675" font-size="11">480 V</text><path d="M632,428.0 L648,428.0" fill="none" stroke="#2f6fd6" stroke-width="2.6"/><rect x="804" y="400" width="140" height="56" rx="6" fill="#f3f6f9" stroke="#2f6fd6" stroke-width="1.6"/><text x="874.0" y="424.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">UPS + batteries B</text><text x="874.0" y="440.0" text-anchor="middle" fill="#5b6675" font-size="11">~5 min ride-through</text><path d="M788,428.0 L804,428.0" fill="none" stroke="#2f6fd6" stroke-width="2.6"/><path d="M944,428.0 L965,428.0 L965,297 L990,297" fill="none" stroke="#2f6fd6" stroke-width="2.6" marker-end="url(#aBlue)"/><rect x="336" y="200" width="140" height="50" rx="6" fill="#f3f6f9" stroke="#5b6675" stroke-width="1.6"/><text x="406.0" y="221.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Generators A</text><text x="406.0" y="237.0" text-anchor="middle" fill="#5b6675" font-size="11">N+1 · 3 MW each</text><path d="M406,200 L406,166" fill="none" stroke="#5b6675" stroke-width="2" stroke-dasharray="5,4"/><rect x="336" y="316" width="140" height="50" rx="6" fill="#f3f6f9" stroke="#5b6675" stroke-width="1.6"/><text x="406.0" y="337.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Generators B</text><text x="406.0" y="353.0" text-anchor="middle" fill="#5b6675" font-size="11">N+1 · 3 MW each</text><path d="M406,366 L406,400" fill="none" stroke="#5b6675" stroke-width="2" stroke-dasharray="5,4"/><text x="490" y="230" fill="#5b6675" font-size="11">start and synchronise in ~10 s, then an automatic transfer switch moves the bus</text><rect x="990" y="236" width="180" height="94" rx="6" fill="#f3f6f9" stroke="#1b2430" stroke-width="1.6"/><text x="1080.0" y="279.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Rack power shelf</text><text x="1080.0" y="295.0" text-anchor="middle" fill="#5b6675" font-size="11">dual-corded: A and B</text><path d="M1080,330 L1080,372" fill="none" stroke="#c99a1e" stroke-width="2.4" marker-end="url(#aAmber)"/><rect x="990" y="374" width="180" height="50" rx="6" fill="#f3f6f9" stroke="#c99a1e" stroke-width="1.6"/><text x="1080.0" y="395.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Server PSU / DC bus</text><text x="1080.0" y="411.0" text-anchor="middle" fill="#5b6675" font-size="11">→ ~50 V DC</text><path d="M1080,424 L1080,462" fill="none" stroke="#c99a1e" stroke-width="2.4" marker-end="url(#aAmber)"/><rect x="990" y="464" width="180" height="50" rx="6" fill="#f3f6f9" stroke="#c99a1e" stroke-width="1.6"/><text x="1080.0" y="485.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">VRM next to the chip</text><text x="1080.0" y="501.0" text-anchor="middle" fill="#5b6675" font-size="11">50 V → ~0.8 V, ~1,000 A</text><rect x="24" y="520" width="940" height="62" rx="6" fill="#f3f6f9" stroke="#c4ccd6"/><path d="M40,542 L76,542" fill="none" stroke="#d64541" stroke-width="3"/><text x="86" y="546" fill="#1b2430" font-size="12">Path A</text><path d="M40,564 L76,564" fill="none" stroke="#2f6fd6" stroke-width="3"/><text x="86" y="568" fill="#1b2430" font-size="12">Path B — fully independent; either path can carry 100% of the load (2N)</text><text x="560" y="546" fill="#1b2430" font-size="12" font-weight="600">If the utility fails:</text><text x="560" y="566" fill="#5b6675" font-size="11.5">t = 0 batteries carry load · t ≈ 10 s generators online · t ≈ 15 s transfer · batteries recharge</text></svg>