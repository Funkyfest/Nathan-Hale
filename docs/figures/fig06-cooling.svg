<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="IBM Plex Sans, Arial, Helvetica, sans-serif"><rect width="1200" height="600" fill="#ffffff"/><text x="24" y="34" fill="#1b2430" font-size="19" font-weight="700">Cooling loops — how heat gets from a GPU to the outside air</text><text x="24" y="54" fill="#5b6675" font-size="12.5">Blue is the cooler fluid going toward the load; red is the warmer fluid coming back. Temperatures are typical for a warm-water AI hall.</text><defs><marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker><marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64541"/></marker><marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/></marker><marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99a1e"/></marker></defs><rect x="24" y="76" width="250" height="400" rx="8" fill="#f3f6f9" stroke="#c4ccd6"/><text x="38" y="98" fill="#5b6675" font-size="11" font-weight="700" letter-spacing="1.2">OUTSIDE</text><rect x="300" y="76" width="330" height="400" rx="8" fill="#f3f6f9" stroke="#c4ccd6"/><text x="314" y="98" fill="#5b6675" font-size="11" font-weight="700" letter-spacing="1.2">FACILITY WATER LOOP</text><rect x="656" y="76" width="300" height="400" rx="8" fill="#f3f6f9" stroke="#c4ccd6"/><text x="670" y="98" fill="#5b6675" font-size="11" font-weight="700" letter-spacing="1.2">TECHNOLOGY (RACK) LOOP</text><rect x="982" y="76" width="194" height="400" rx="8" fill="#f3f6f9" stroke="#c4ccd6"/><text x="996" y="98" fill="#5b6675" font-size="11" font-weight="700" letter-spacing="1.2">IT</text><rect x="54" y="130" width="190" height="74" rx="6" fill="#f3f6f9" stroke="#1b2430" stroke-width="1.6"/><text x="149.0" y="163.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Dry coolers</text><text x="149.0" y="179.0" text-anchor="middle" fill="#5b6675" font-size="11">fans blow outside air over coils</text><rect x="54" y="250" width="190" height="74" rx="6" fill="#f3f6f9" stroke="#5b6675" stroke-width="1.6"/><text x="149.0" y="283.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Adiabatic pre-cool</text><text x="149.0" y="299.0" text-anchor="middle" fill="#5b6675" font-size="11">water spray only on hot days</text><rect x="54" y="370" width="190" height="74" rx="6" fill="#f3f6f9" stroke="#5b6675" stroke-width="1.6"/><text x="149.0" y="403.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Trim chiller (optional)</text><text x="149.0" y="419.0" text-anchor="middle" fill="#5b6675" font-size="11">runs only above ~30 °C outside</text><rect x="340" y="170" width="250" height="70" rx="6" fill="#f3f6f9" stroke="#1b2430" stroke-width="1.6"/><text x="465.0" y="201.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Facility pumps</text><text x="465.0" y="217.0" text-anchor="middle" fill="#5b6675" font-size="11">variable speed, N+1</text><rect x="340" y="310" width="250" height="70" rx="6" fill="#f3f6f9" stroke="#2e9d62" stroke-width="1.6"/><text x="465.0" y="341.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Heat-reuse take-off</text><text x="465.0" y="357.0" text-anchor="middle" fill="#5b6675" font-size="11">district heating, if a customer is near</text><rect x="690" y="170" width="230" height="210" rx="6" fill="#f3f6f9" stroke="#1b2430" stroke-width="1.6"/><text x="805" y="200" text-anchor="middle" fill="#1b2430" font-size="13" font-weight="700">CDU</text><text x="805" y="218" text-anchor="middle" fill="#5b6675" font-size="11">coolant distribution unit</text><text x="805" y="262" text-anchor="middle" fill="#5b6675" font-size="11.5">plate heat exchanger</text><text x="805" y="284" text-anchor="middle" fill="#5b6675" font-size="11.5">keeps facility and IT water apart</text><text x="805" y="306" text-anchor="middle" fill="#5b6675" font-size="11.5">secondary pumps + filters</text><text x="805" y="328" text-anchor="middle" fill="#5b6675" font-size="11.5">watches flow, ΔT, pressure, leaks</text><rect x="1000" y="130" width="160" height="120" rx="6" fill="#f3f6f9" stroke="#1b2430" stroke-width="1.6"/><text x="1080.0" y="186.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Cold plates</text><text x="1080.0" y="202.0" text-anchor="middle" fill="#5b6675" font-size="11">on every GPU &amp; CPU</text><text x="1080" y="214" text-anchor="middle" fill="#5b6675" font-size="11">≈ 80–85% of rack heat</text><rect x="1000" y="300" width="160" height="120" rx="6" fill="#f3f6f9" stroke="#5b6675" stroke-width="1.6"/><text x="1080.0" y="356.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Rack fans → room air</text><text x="1080.0" y="372.0" text-anchor="middle" fill="#5b6675" font-size="11">memory, NICs, PSUs</text><text x="1080" y="384" text-anchor="middle" fill="#5b6675" font-size="11">≈ 15–20% of rack heat</text><path d="M244,158 L300,158 L300,195 L340,195" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#aBlue)"/><text x="252" y="150" fill="#2f6fd6" font-size="11">32 °C</text><path d="M590,195 L690,195" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#aBlue)"/><path d="M690,350 L620,350 L620,440 L290,440 L290,180 L248,180" fill="none" stroke="#d64541" stroke-width="3" marker-end="url(#aRed)"/><text x="630" y="432" fill="#d64541" font-size="11">42 °C</text><path d="M465,380 L465,430" fill="none" stroke="#2e9d62" stroke-width="2" stroke-dasharray="4,4"/><path d="M920,210 L1000,190" fill="none" stroke="#2f6fd6" stroke-width="3" marker-end="url(#aBlue)"/><text x="930" y="194" fill="#2f6fd6" font-size="11">35 °C</text><path d="M1000,230 L920,300" fill="none" stroke="#d64541" stroke-width="3" marker-end="url(#aRed)"/><text x="944" y="318" fill="#d64541" font-size="11">45 °C</text><rect x="24" y="492" width="1152" height="88" rx="6" fill="#ffffff" stroke="#c4ccd6"/><text x="40" y="516" fill="#1b2430" font-size="12" font-weight="700">Why warm water works:</text><text x="210" y="516" fill="#5b6675" font-size="12">35 °C coolant is hotter than outside air most of the year, so dry coolers can reject the heat with no compressor running.</text><text x="40" y="538" fill="#1b2430" font-size="12" font-weight="700">Why two loops:</text><text x="210" y="538" fill="#5b6675" font-size="12">the CDU isolates clean, treated rack water from the much larger and dirtier facility loop; a leak in one cannot drain the other.</text><text x="40" y="560" fill="#1b2430" font-size="12" font-weight="700">Design targets:</text><text x="210" y="560" fill="#5b6675" font-size="12">ΔT of 10 K across the rack · approach of 3–5 K at the CDU · PUE 1.1–1.2 · near-zero water use when the adiabatic stage is idle.</text></svg>