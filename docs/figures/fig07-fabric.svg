<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" font-family="IBM Plex Sans, Arial, Helvetica, sans-serif"><rect width="1200" height="610" fill="#ffffff"/><text x="24" y="34" fill="#1b2430" font-size="19" font-weight="700">Network fabric — leaf-spine with rail-optimized GPU connections</text><text x="24" y="54" fill="#5b6675" font-size="12.5">Each server has 8 GPUs and 8 network cards. One scalable unit shown; large clusters add a third (super-spine) tier on top.</text><defs><marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd6"/></marker><marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64541"/></marker><marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/></marker><marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c99a1e"/></marker></defs><rect x="90" y="84" width="120" height="40" rx="6" fill="#f3f6f9" stroke="#6b5bd1" stroke-width="1.6"/><text x="150.0" y="108.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Spine 1</text><rect x="270" y="84" width="120" height="40" rx="6" fill="#f3f6f9" stroke="#6b5bd1" stroke-width="1.6"/><text x="330.0" y="108.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Spine 2</text><rect x="450" y="84" width="120" height="40" rx="6" fill="#f3f6f9" stroke="#6b5bd1" stroke-width="1.6"/><text x="510.0" y="108.0" text-anchor="middle" fill="#1b2430" font-size="12.5" font-weight="600">Spine 3</text><rect x="630" y="84" width="120" height="40" rx="6" fill="#f3f6f9" stroke="#6b5bd1" stroke-width="1.6"/><text x="690.0" y="108.0" text-anchor=