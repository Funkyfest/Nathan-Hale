b6675" font-size="12">GPU 0 in every server plugs into the "rail 0" leaf, GPU 1 into rail 1, and so on (two rails highlighted).</text><text x="150" y="578" fill="#5b6675" font-size="12">Training traffic mostly flows between same-numbered GPUs, so most of it crosses one switch instead of three.</text></svg>