<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8FB">
<meta name="description" content="Kiki: Algebra 2 and SAT math practice, made for Keaton.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiki">
<title>Kiki · Algebra & SAT</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFF8FB; --ink: #2B1A33; --ink2: #5E4A66; --muted: #8E7C95; --line: #F3E6EE; --line2: #EBD8E3;
  --pink: #FF4B91; --pink-d: #D63375; --pink-t: #FFE4EF;
  --purple: #9B6BFF; --purple-d: #7A4BE0; --purple-t: #EFE7FF;
  --green: #22C483; --green-d: #169E68; --green-t: #DDF8EC;
  --blue: #1CB0F6; --blue-d: #1590CF; --blue-t: #DDF2FD;
  --red: #FF5A6E; --red-d: #D93C52; --red-t: #FFE3E7;
  --gold: #FFC53D; --gold-d: #E0A300; --orange: #FF9640;
  --f-body: 'Nunito', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-disp: 'Fredoka', 'Nunito', ui-rounded, system-ui, sans-serif;
  --w: 560px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: var(--f-body); color: var(--ink); background-color: var(--bg);
  background-image: radial-gradient(#FFE1EE 1.4px, transparent 1.6px); background-size: 22px 22px;
  -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh;
}
button { font-family: inherit; }
a { color: var(--purple-d); font-weight: 800; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12px; font-weight: 700; margin: 8px 0 0; }
.center { text-align: center; }
.left { text-align: left; width: 100%; }
.kick { font: 900 11px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.kick.light { color: rgba(255,255,255,.85); }
.sec-h { font: 600 20px var(--f-disp); margin: 24px 2px 10px; }
.card { background: #fff; border: 2px solid var(--line2); border-radius: 20px; padding: 14px 16px; box-shadow: 0 4px 0 var(--line2); }

/* ── Buttons (chunky, 3D, press-down) ── */
.btn {
  --b: var(--pink); --bd: var(--pink-d); --fg: #fff;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 800 15px/1.15 var(--f-body); letter-spacing: .05em; text-transform: uppercase; text-decoration: none;
  color: var(--fg); background: var(--b); border: 0; border-radius: 16px; padding: 14px 18px;
  box-shadow: 0 4px 0 var(--bd); cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--bd); }
.btn:disabled { --b: #F1E8ED; --bd: #DECFD7; --fg: #B6A6AF; cursor: not-allowed; filter: none; }
.btn-green { --b: var(--green); --bd: var(--green-d); }
.btn-red { --b: var(--red); --bd: var(--red-d); }
.btn-purple { --b: var(--purple); --bd: var(--purple-d); }
.btn-blue { --b: var(--blue); --bd: var(--blue-d); }
.btn-unit { --b: var(--c); --bd: var(--cd); }
.btn-ghost { --b: #fff; --bd: var(--line2); --fg: var(--ink2); box-shadow: 0 3px 0 var(--line2); border: 2px solid var(--line2); }
.btn-text { background: none; box-shadow: none; color: var(--muted); }
.btn.big { padding: 17px 20px; font-size: 16px; border-radius: 18px; }
.btn.block { width: 100%; }
.btn.grow { flex: 1; }
.btn.sm { padding: 9px 12px; font-size: 12px; border-radius: 12px; }
.btn.danger { --fg: var(--red-d); }
.btn.stack { flex-direction: column; gap: 4px; }
.btn small { font: 700 12px var(--f-body); text-transform: none; letter-spacing: 0; opacity: .92; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ── Kiki ── */
.kiki { display: inline-block; line-height: 0; flex: none; }
.kiki svg { width: 100%; height: auto; overflow: visible; }
.kiki .k-petals { transform-origin: 60px 58px; animation: spin 26s linear infinite; }
.kiki.idle { animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
.kiki.bounce { animation: bounce .75s cubic-bezier(.28,1.6,.5,1) both; }
.kiki.wiggle { animation: wiggle .55s ease both; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3px); } }
@keyframes bounce { 0% { transform: scale(.55) translateY(14px); } 60% { transform: scale(1.08) translateY(-8px); } 100% { transform: none; } }
@keyframes wiggle { 0%, 100% { transform: none; } 20% { transform: rotate(-11deg); } 40% { transform: rotate(9deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(3deg); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes up2 { from { transform: translateY(12px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { 40% { transform: scale(1.05); } }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes bump { 50% { transform: scale(1.35); } }

/* ── Tab screens ── */
.screen-tabs { max-width: var(--w); margin: 0 auto; padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px; background: rgba(255,248,251,.92);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 2px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; font: 600 26px var(--f-disp); color: var(--pink); letter-spacing: -.02em; }
.chips { display: flex; gap: 2px; }
.chip { display: flex; align-items: center; gap: 4px; background: none; border: 0; padding: 6px 7px; border-radius: 12px; cursor: pointer; font: 900 15px var(--f-body); color: var(--ink); }
.chip:hover { background: #fff; }
.chip-streak b { color: var(--orange); }
.chip-streak.cold { filter: grayscale(1); opacity: .55; }
.chip-gems b { color: var(--blue-d); }
.chip-goal b { color: var(--gold-d); }
.view { padding: 14px 16px 24px; }
.tabbar {
  position: fixed; z-index: 10; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: var(--w);
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #fff; border-top: 2px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 1px; background: none; border: 2px solid transparent; border-radius: 14px; padding: 5px 0; cursor: pointer; font: 800 11px var(--f-body); color: var(--muted); }
.tab-ic { font-size: 22px; line-height: 1.15; }
.tab.on { color: var(--pink-d); background: var(--pink-t); border-color: #FFC4DC; }

/* ── Learn path ── */
.hello { display: flex; align-items: center; gap: 12px; margin: 2px 0 18px; }
.speech, .bubble {
  position: relative; background: #fff; border: 2px solid var(--line2); border-radius: 18px; box-shadow: 0 3px 0 var(--line2);
  font-weight: 700; color: var(--ink2);
}
.speech { padding: 12px 14px; line-height: 1.4; }
.speech::before, .bubble::before {
  content: ""; position: absolute; left: -9px; width: 14px; height: 14px; background: #fff;
  border-left: 2px solid var(--line2); border-bottom: 2px solid var(--line2); transform: rotate(45deg);
}
.speech::before { top: calc(50% - 7px); }
.unit { margin-bottom: 8px; }
.unit-banner {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #fff;
  background: var(--c); border-radius: 22px; padding: 16px 18px; box-shadow: 0 5px 0 var(--cd);
}
.unit-kick { font: 900 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; opacity: .88; }
.unit-banner h2 { font: 600 25px/1.1 var(--f-disp); margin: 4px 0 3px; }
.unit-banner p { margin: 0; font-weight: 700; font-size: 13px; opacity: .93; }
.unit-count { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,.22); border-radius: 14px; padding: 8px 11px; font: 600 18px var(--f-disp); }
.path { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 40px 0 28px; }
.node-row { position: relative; display: flex; flex-direction: column; align-items: center; transform: translateX(var(--x)); }
.node {
  position: relative; width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: var(--c); box-shadow: 0 7px 0 var(--cd); transition: transform .1s, box-shadow .1s;
}
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--cd); }
.node.lv0 { background: color-mix(in srgb, var(--c) 32%, #fff); box-shadow: 0 7px 0 color-mix(in srgb, var(--cd) 42%, #fff); }
.node.lv4 { background: var(--gold); box-shadow: 0 7px 0 var(--gold-d); }
.node.current { animation: halo 2s ease-out infinite; }
@keyframes halo {
  0% { box-shadow: 0 7px 0 var(--cd), 0 0 0 0 color-mix(in srgb, var(--c) 50%, transparent); }
  70%, 100% { box-shadow: 0 7px 0 var(--cd), 0 0 0 18px transparent; }
}
.node.lv0.current { animation-name: halo0; }
@keyframes halo0 {
  0% { box-shadow: 0 7px 0 color-mix(in srgb, var(--cd) 42%, #fff), 0 0 0 0 color-mix(in srgb, var(--c) 50%, transparent); }
  70%, 100% { box-shadow: 0 7px 0 color-mix(in srgb, var(--cd) 42%, #fff), 0 0 0 18px transparent; }
}
.node-face { font-size: 32px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.08)); }
.node-ring { position: absolute; inset: -13px; width: calc(100% + 26px); height: calc(100% + 26px); pointer-events: none; }
.start-tip {
  position: absolute; top: -50px; z-index: 2; background: #fff; color: var(--c); border: 2px solid var(--line2);
  font: 900 14px var(--f-body); letter-spacing: .12em; padding: 7px 13px; border-radius: 12px; box-shadow: 0 3px 0 var(--line2);
  animation: float 1.4s ease-in-out infinite; pointer-events: none;
}
.start-tip::after {
  content: ""; position: absolute; left: calc(50% - 6px); bottom: -8px; width: 12px; height: 12px; background: #fff;
  border-right: 2px solid var(--line2); border-bottom: 2px solid var(--line2); transform: rotate(45deg);
}
.node-label { margin-top: 15px; font: 800 13px/1.2 var(--f-body); color: var(--ink2); text-align: center; max-width: 132px; }
.node-label small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.node-kiki { position: absolute; top: -4px; pointer-events: none; }
.node-kiki.left { right: calc(100% + 18px); }
.node-kiki.right { left: calc(100% + 18px); }
.foot-note { text-align: center; color: var(--muted); font-weight: 700; font-size: 12px; margin: 12px 0 0; }

/* ── Bottom sheets ── */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(43,26,51,.38); animation: fade .2s ease; }
.sheet {
  position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: var(--w);
  max-height: 88vh; overflow: auto; background: #fff; border-radius: 26px 26px 0 0;
  padding: 10px 20px calc(22px + env(safe-area-inset-bottom)); animation: sheetUp .34s cubic-bezier(.2,1.2,.4,1);
}
@keyframes sheetUp { from { transform: translate(-50%, 50px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet-grip { width: 44px; height: 5px; border-radius: 9px; background: var(--line2); margin: 0 auto 14px; }
.sheet h3 { font: 600 23px var(--f-disp); margin: 0; }
.sheet.center { text-align: center; display: grid; gap: 10px; justify-items: center; padding-top: 22px; }
.sheet.center p { margin: 0 0 4px; font-weight: 700; }
.sheet-head { display: flex; gap: 12px; align-items: center; }
.sheet-icon { width: 58px; height: 58px; flex: none; border-radius: 18px; background: var(--ct); display: grid; place-items: center; font-size: 30px; }
.sheet-kick { font: 900 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--cd); }
.sheet-blurb { color: var(--ink2); font-weight: 700; margin: 14px 0; }
.mastery-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mastery-bar span { height: 12px; border-radius: 9px; background: #F1E6EC; }
.mastery-bar span.on { background: var(--c); }
.mastery-row { display: flex; justify-content: space-between; margin: 8px 0 14px; font-weight: 700; font-size: 13px; color: var(--muted); }
.mastery-row b { color: var(--ink); }
.next-lesson { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--ct); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; font-weight: 700; color: var(--ink2); }
.nl-tag { background: var(--c); color: #fff; border-radius: 9px; padding: 4px 9px; font: 900 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }

/* ── Lesson ── */
.screen-lesson, .screen-test, .screen-flow { height: 100vh; height: 100dvh; }
.lesson, .sat-test { max-width: var(--w); height: 100%; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
.lesson-top { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 14px 8px; }
.icon-btn { width: 40px; height: 40px; flex: none; border: 0; border-radius: 12px; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: #fff; }
.bar { flex: 1; height: 16px; border-radius: 99px; background: #F1E4EB; overflow: hidden; }
.bar-fill { position: relative; height: 100%; min-width: 16px; border-radius: 99px; background: var(--c); transition: width .55s cubic-bezier(.3,1.35,.5,1); }
.bar-fill::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 9px; background: rgba(255,255,255,.42); }
.combo { display: flex; align-items: center; gap: 1px; min-width: 42px; font: 900 16px var(--f-body); color: var(--orange); opacity: .25; filter: grayscale(1); transition: opacity .2s, filter .2s; }
.combo.on { opacity: 1; filter: none; }
.combo.bump { animation: bump .45s; }
.lesson-body { flex: 1; overflow: auto; padding: 6px 16px 22px; -webkit-overflow-scrolling: touch; }
.q-label { font: 900 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--cd, var(--purple-d)); margin: 6px 0 12px; }
.redo-tag { background: var(--gold); color: #5A3E00; border-radius: 8px; padding: 3px 8px; margin-right: 8px; }
.q-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; }
.q-kiki { flex: none; margin-top: 4px; }
.bubble { flex: 1; padding: 14px 16px; font-size: 17px; line-height: 1.5; color: var(--ink); }
.bubble::before { top: 28px; }
.q-prompt { font-weight: 700; font-size: 18px; line-height: 1.5; margin-bottom: 14px; }
.visual { margin: 0 0 16px; }
.eqv {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; padding: 14px 10px;
  background: #fff; border: 2px dashed var(--line2); border-radius: 18px; font: 600 24px var(--f-disp);
}
.receipts { display: grid; gap: 10px; }
.tok { font-size: 27px; letter-spacing: 0; line-height: 1.15; }
.op { color: var(--muted); font-weight: 500; }
.cash { background: var(--green-t); color: var(--green-d); border-radius: 12px; padding: 2px 10px; }
.eq {
  background: #fff; border: 2px solid var(--line2); border-radius: 18px; box-shadow: 0 3px 0 var(--line2);
  padding: 16px; text-align: center; font: 600 26px/1.5 var(--f-disp); color: var(--ink); overflow-x: auto;
}
.think { text-align: center; margin-top: 8px; font-weight: 800; font-size: 14px; color: var(--purple-d); }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 2px solid var(--line2); border-radius: 16px; overflow: hidden; text-align: center; font-weight: 800; }
.tbl caption { text-align: left; font: 800 13px var(--f-body); color: var(--ink2); padding: 0 2px 6px; }
.tbl th, .tbl td { padding: 10px 6px; border-bottom: 1px solid var(--line); }
.tbl thead th { background: var(--ct, #F7EEF3); font-size: 13px; }
.tbl tbody th { text-align: left; padding-left: 12px; font-size: 13px; color: var(--ink2); }
.tbl td:last-child { color: var(--muted); }
.tbl tr.tot th, .tbl tr.tot td { background: #FBF6F9; color: var(--muted); border-bottom: 0; }
.tri { display: block; width: 100%; max-width: 260px; margin: 0 auto; }
.tl { font: 800 16px var(--f-body); fill: var(--ink); }
.tl.ang { fill: var(--purple-d); }
.choices { display: grid; gap: 10px; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choice {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; text-align: left; cursor: pointer;
  background: #fff; border: 2px solid var(--line2); border-bottom-width: 4px; border-radius: 16px; padding: 12px 14px;
  font: 800 18px/1.3 var(--f-body); color: var(--ink); touch-action: manipulation; transition: transform .08s, background .15s, border-color .15s;
}
.choice:hover:not(:disabled) { background: #FFFBFD; }
.choice:active:not(:disabled) { transform: translateY(2px); }
.choice kbd { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--line2); border-radius: 9px; background: #fff; font: 800 13px var(--f-body); color: var(--muted); }
.choice.sel { background: var(--blue-t); border-color: #7FD1FA; color: var(--blue-d); }
.choice.sel kbd { border-color: #7FD1FA; color: var(--blue-d); }
.choice.right { background: var(--green-t); border-color: #7EE0B6; color: var(--green-d); animation: pop .4s; }
.choice.right kbd { border-color: #7EE0B6; color: var(--green-d); }
.choice.wrong { background: var(--red-t); border-color: #FFA3AF; color: var(--red-d); animation: shake .45s; }
.choice.wrong kbd { border-color: #FFA3AF; color: var(--red-d); }
.choice:disabled { cursor: default; }
.grid-label { font-weight: 800; color: var(--ink2); margin-bottom: 8px; }
.grid-label small { display: block; margin-top: 2px; color: var(--muted); font-weight: 700; }
.grid-display {
  display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 70px; margin-bottom: 12px;
  background: #fff; border: 2px solid var(--line2); border-bottom-width: 4px; border-radius: 18px; font: 600 34px var(--f-disp);
}
.gd-unit { color: var(--muted); font-size: 24px; }
.caret { width: 3px; height: 34px; border-radius: 3px; background: var(--blue); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.grid-display.right { background: var(--green-t); border-color: #7EE0B6; color: var(--green-d); animation: pop .4s; }
.grid-display.wrong { background: var(--red-t); border-color: #FFA3AF; color: var(--red-d); animation: shake .45s; }
.grid-display.right .caret, .grid-display.wrong .caret { display: none; }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.key {
  height: 54px; border: 2px solid var(--line2); border-bottom-width: 4px; border-radius: 14px; background: #fff;
  font: 600 24px var(--f-disp); color: var(--ink); cursor: pointer; touch-action: manipulation;
}
.key:active:not(:disabled) { transform: translateY(2px); }
.key.fn { background: #FBF4F8; color: var(--purple-d); }
.key.wide { grid-column: span 2; }
.key:disabled { opacity: .5; }
.hint-box ul { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.hint-box li { background: #FFF7DD; border: 2px solid #FFE08A; border-radius: 14px; padding: 10px 12px; font-weight: 700; color: #6B5100; animation: up2 .25s; }
.lesson-foot { max-height: 72vh; overflow: auto; background: #fff; border-top: 2px solid var(--line); padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
.lesson-foot.ok { background: #E3FAEF; border-color: #BDEFD7; }
.lesson-foot.no { background: #FFE8EB; border-color: #FFC9D1; }
.foot-row { display: flex; gap: 10px; }
.fb { display: grid; gap: 12px; animation: up2 .25s ease; }
.fb-head { display: flex; gap: 12px; align-items: center; }
.fb-icon { width: 44px; height: 44px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #fff; font: 900 24px var(--f-body); }
.ok .fb-icon { color: var(--green); }
.no .fb-icon { color: var(--red); }
.fb-title { font: 600 23px var(--f-disp); }
.ok .fb-title { color: var(--green-d); }
.no .fb-title { color: var(--red-d); }
.fb-xp { font: 900 13px var(--f-body); background: var(--gold); color: #5A3E00; border-radius: 8px; padding: 3px 7px; vertical-align: middle; }
.fb-line { font-weight: 700; color: var(--ink2); }
.fb-answer { font-weight: 700; color: var(--red-d); }
.fb-steps { background: rgba(255,255,255,.75); border-radius: 14px; padding: 10px 14px; font-weight: 600; color: var(--ink2); }
.fb-steps summary { cursor: pointer; font-weight: 800; color: var(--ink); }
.fb-steps ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; line-height: 1.45; }
.fb-steps b, .rv-body b { color: var(--ink); }
.bridge { display: flex; gap: 10px; background: #F1EAFF; border: 2px solid #D9C8FF; border-radius: 14px; padding: 10px 12px; font-weight: 700; color: #4B2E9A; line-height: 1.45; }
.bridge span { font-size: 20px; }

/* ── SAT practice test ── */
.st-top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 8px; background: #fff; border-bottom: 2px solid var(--line); }
.st-title { flex: 1; text-align: center; font: 600 17px var(--f-disp); }
.timer { min-width: 74px; border: 0; border-radius: 12px; padding: 8px 12px; cursor: pointer; background: var(--blue-t); color: var(--blue-d); font: 900 15px var(--f-body); font-variant-numeric: tabular-nums; }
.timer.low { background: var(--red-t); color: var(--red-d); }
.timer.off { background: #F3EEF1; color: var(--muted); }
.st-sub { display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
.qnum { background: var(--ink); color: #fff; font: 900 15px var(--f-body); border-radius: 10px; padding: 6px 11px; }
.flag { background: none; border: 2px solid var(--line2); border-radius: 12px; padding: 7px 11px; cursor: pointer; font: 800 13px var(--f-body); color: var(--muted); }
.flag.on { background: #FFF4D6; border-color: #FFD877; color: #8A6200; }
.st-body { flex: 1; overflow: auto; padding: 12px 16px 22px; }
.st-foot { display: flex; align-items: center; gap: 10px; background: #fff; border-top: 2px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.st-nav { flex: 1; border: 0; border-radius: 14px; padding: 13px; cursor: pointer; background: var(--ink); color: #fff; font: 900 14px var(--f-body); }
.legend { display: flex; gap: 14px; margin: 8px 0 12px; font-weight: 700; font-size: 12px; color: var(--muted); }
.lg { display: inline-block; width: 12px; height: 12px; margin-right: 4px; vertical-align: -1px; border: 2px dashed var(--line2); border-radius: 4px; }
.lg.cur { border: 2px solid var(--ink); }
.lg.done { background: var(--blue); border-color: var(--blue); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 9px; margin-bottom: 16px; }
.qg { position: relative; height: 46px; border: 2px dashed var(--line2); border-radius: 12px; background: #fff; cursor: pointer; font: 900 15px var(--f-body); color: var(--ink2); }
.qg.done { background: var(--blue); border: 2px solid var(--blue-d); color: #fff; }
.qg.cur { outline: 3px solid var(--ink); outline-offset: 2px; }
.qg i { position: absolute; top: -9px; right: -6px; font-style: normal; font-size: 14px; }

/* ── SAT tab ── */
.sat-hero { margin-bottom: 16px; padding: 18px 18px 16px; color: #fff; border-radius: 24px; background: linear-gradient(135deg, var(--purple), var(--pink)); box-shadow: 0 6px 0 var(--purple-d); overflow: hidden; }
.sat-hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sat-score b { font: 600 58px/1 var(--f-disp); }
.sat-cap { margin-top: 4px; font-weight: 700; font-size: 13px; opacity: .92; }
.spark { width: 100%; height: auto; margin-top: 12px; }
.sat-best { margin-top: 8px; font-weight: 700; font-size: 13px; }
.sat-actions { display: grid; gap: 12px; }
.dom-row { display: grid; grid-template-columns: minmax(0, 1.25fr) 2fr auto; align-items: center; gap: 10px; padding: 6px 0; font-weight: 800; font-size: 13px; color: var(--ink2); }
.dom-bar { height: 12px; border-radius: 9px; background: #F3E9EF; overflow: hidden; }
.dom-bar i { display: block; height: 100%; min-width: 4px; border-radius: 9px; }
.tips { display: grid; gap: 10px; }
.tip { background: #fff; border: 2px solid var(--line2); border-radius: 16px; padding: 12px 14px; box-shadow: 0 3px 0 var(--line2); }
.tip summary { list-style: none; cursor: pointer; font-weight: 800; }
.tip summary::-webkit-details-marker { display: none; }
.tip summary::after { content: "+"; float: right; color: var(--muted); font-size: 18px; line-height: 1; }
.tip[open] summary::after { content: "−"; }
.tip p { margin: 8px 0 0; font-weight: 600; color: var(--ink2); line-height: 1.5; }
.hist-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; color: var(--ink2); }
.hist-row:last-child { border-bottom: 0; }
.hist-row b { font: 600 18px var(--f-disp); color: var(--purple-d); }

/* ── Quests ── */
.goal-card { display: flex; gap: 16px; align-items: center; background: #fff; border: 2px solid var(--line2); border-radius: 22px; padding: 16px; box-shadow: 0 4px 0 var(--line2); }
.goal-in h2 { font: 600 27px var(--f-disp); margin: 2px 0; }
.goal-in p { margin: 0; font-weight: 700; color: var(--muted); }
.quest { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.quest:last-of-type { border-bottom: 0; }
.q-ic { width: 40px; text-align: center; font-size: 26px; }
.q-main { flex: 1; }
.q-t { margin-bottom: 6px; font-weight: 800; }
.q-bar { position: relative; height: 18px; border-radius: 99px; background: #F3E9EF; overflow: hidden; }
.q-bar i { display: block; height: 100%; border-radius: 99px; background: var(--gold); }
.q-bar span { position: absolute; inset: 0; display: grid; place-items: center; font: 900 11px var(--f-body); color: #6B5100; }
.quest.done .q-bar i { background: var(--green); }
.quest.done .q-bar span { color: #fff; }
.q-gift { font-size: 24px; }
.streak-card { text-align: center; }
.streak-big { display: flex; align-items: center; justify-content: center; gap: 8px; }
.streak-big span { font-size: 40px; }
.streak-big span.cold { filter: grayscale(1); opacity: .5; }
.streak-big b { font: 600 46px var(--f-disp); color: var(--orange); }
.streak-big small { font-weight: 800; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0 4px; width: 100%; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 800 12px var(--f-body); color: var(--muted); }
.wd i { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #F3E9EF; font-style: normal; font-size: 16px; }
.wd.on i { background: #FFE7D1; }
.wd.today span { color: var(--ink); }
.wd.today i { outline: 2px solid var(--orange); outline-offset: 2px; }

/* ── Shop ── */
.shop-hero { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; background: #fff; border: 2px solid var(--line2); border-radius: 22px; padding: 16px; box-shadow: 0 4px 0 var(--line2); }
.shop-hero h2 { font: 600 30px var(--f-disp); margin: 2px 0; color: var(--blue-d); }
.shop-hero p { margin: 0; font-weight: 700; font-size: 13px; }
.shop-list { display: grid; gap: 12px; }
.shop-item { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--line2); border-radius: 20px; padding: 12px 14px; box-shadow: 0 4px 0 var(--line2); }
.si-ic { width: 62px; height: 62px; flex: none; display: grid; place-items: center; border-radius: 18px; background: var(--pink-t); }
.si-emoji { font-size: 32px; }
.si-main { flex: 1; }
.si-main p { margin: 2px 0 0; font-weight: 700; font-size: 13px; color: var(--muted); }

/* ── Me ── */
.me-hero { text-align: center; padding: 4px 0; }
.me-hero h2 { font: 600 29px var(--f-disp); margin: 6px 0 0; }
.me-hero p { margin: 2px 0 0; font-weight: 700; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.sg { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; background: #fff; border: 2px solid var(--line2); border-radius: 18px; padding: 12px 14px; box-shadow: 0 3px 0 var(--line2); }
.sg span { grid-row: span 2; font-size: 26px; }
.sg b { font: 600 22px var(--f-disp); }
.sg small { font-weight: 800; font-size: 12px; color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; }
.col { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.col b { min-height: 14px; font: 900 11px var(--f-body); color: var(--muted); }
.bar-v { flex: 1; width: 100%; max-width: 30px; display: flex; align-items: flex-end; overflow: hidden; border-radius: 10px; background: #F6EEF2; }
.bar-v i { display: block; width: 100%; border-radius: 10px; background: var(--pink); }
.bar-v i.hit { background: var(--gold); }
.col span { font: 800 12px var(--f-body); color: var(--muted); }
.col.today span { color: var(--ink); }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; background: #fff; border: 2px solid var(--line2); border-radius: 18px; padding: 12px 6px; opacity: .55; }
.badge span { font-size: 30px; filter: grayscale(1); }
.badge b { font: 800 12px var(--f-body); }
.badge small { font-weight: 700; font-size: 10.5px; line-height: 1.25; color: var(--muted); }
.badge.on { opacity: 1; background: #FFFBEA; border-color: #FFD877; box-shadow: 0 3px 0 #FFD877; }
.badge.on span { filter: none; }
.dad-card p { margin: 0 0 12px; font-weight: 700; color: var(--ink2); }
.settings { display: grid; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 800; }
.set-row:last-child { border-bottom: 0; }
.set-row.col { flex-direction: column; align-items: stretch; }
.toggle { position: relative; width: 52px; height: 30px; flex: none; border: 0; border-radius: 99px; background: #E5D8DF; cursor: pointer; transition: background .2s; }
.toggle i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.12); transition: left .2s; }
.toggle.on { background: var(--green); }
.toggle.on i { left: 25px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { display: flex; flex-direction: column; align-items: center; gap: 2px; background: #fff; border: 2px solid var(--line2); border-radius: 12px; padding: 8px 2px; cursor: pointer; font: 800 12px var(--f-body); color: var(--ink2); }
.seg small { font-weight: 700; font-size: 10.5px; color: var(--muted); }
.seg button.on { background: var(--pink-t); border-color: var(--pink); color: var(--pink-d); }

/* ── Celebration flow ── */
.flow { max-width: var(--w); height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: calc(16px + env(safe-area-inset-top)) 18px 0; }
.flow-main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; overflow: auto; }
.flow-main.scroll { justify-content: flex-start; padding-top: 6px; }
.flow-title { font: 600 32px/1.1 var(--f-disp); margin: 6px 0 0; }
.flow-sub { margin: 0; font-weight: 700; color: var(--ink2); }
.flow-foot { padding: 14px 0 calc(16px + env(safe-area-inset-bottom)); }
.stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-top: 10px; }
.tile { overflow: hidden; background: #fff; border: 2px solid; border-radius: 16px; animation: up2 .4s both; }
.tile:nth-child(2) { animation-delay: .1s; }
.tile:nth-child(3) { animation-delay: .2s; }
.t-h { padding: 5px 4px; color: #fff; font: 900 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; }
.t-v { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 12px 4px; font: 600 22px var(--f-disp); }
.t-xp { border-color: var(--gold); } .t-xp .t-h { background: var(--gold); } .t-xp .t-v { color: var(--gold-d); }
.t-acc { border-color: var(--green); } .t-acc .t-h { background: var(--green); } .t-acc .t-v { color: var(--green-d); }
.t-time { border-color: var(--blue); } .t-time .t-h { background: var(--blue); } .t-time .t-v { color: var(--blue-d); }
.level-up { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: #F1EAFF; border: 2px solid #D9C8FF; border-radius: 16px; padding: 12px 14px; font-weight: 700; color: #4B2E9A; animation: up2 .4s .45s both; }
.level-hint { font-weight: 700; font-size: 13px; color: var(--muted); }
.gem-earn { padding: 6px 14px; border-radius: 99px; background: var(--blue-t); color: var(--blue-d); font: 900 16px var(--f-body); }
.score-big { font: 600 86px/1 var(--f-disp); background: linear-gradient(135deg, var(--purple), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.delta { padding: 4px 12px; border-radius: 99px; font: 900 14px var(--f-body); }
.delta.up { background: var(--green-t); color: var(--green-d); }
.delta.down { background: var(--red-t); color: var(--red-d); }
.review { display: grid; gap: 8px; width: 100%; text-align: left; padding-bottom: 10px; }
.rv { background: #fff; border: 2px solid var(--line2); border-radius: 14px; }
.rv summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; list-style: none; cursor: pointer; font-weight: 800; }
.rv summary::-webkit-details-marker { display: none; }
.rv-n { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: #F3E9EF; font-size: 13px; }
.rv-s { flex: 1; color: var(--ink2); }
.rv-i { font: 900 18px var(--f-body); }
.rv.ok .rv-i { color: var(--green); }
.rv.no .rv-i { color: var(--red); }
.rv-body { padding: 0 14px 14px; font-weight: 600; color: var(--ink2); }
.rv-body ol { display: grid; gap: 4px; padding-left: 20px; }
.big-flame { font-size: 110px; line-height: 1; animation: flame 1.2s ease-in-out infinite; filter: drop-shadow(0 8px 16px rgba(255,150,64,.4)); }
@keyframes flame { 0%, 100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.08) rotate(3deg); } }
.streak-num { font: 600 96px/1 var(--f-disp); color: var(--orange); }
.quest-pay { display: grid; gap: 10px; width: 100%; margin-top: 8px; }
.qp { display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: 2px solid var(--line2); border-radius: 16px; padding: 12px 14px; box-shadow: 0 3px 0 var(--line2); font-weight: 800; animation: up2 .35s both; }
.qp span { font-size: 24px; }
.qp div { flex: 1; }
.qp b { white-space: nowrap; color: var(--blue-d); }
.badge-big { width: 160px; height: 160px; display: grid; place-items: center; font-size: 92px; border-radius: 50%; background: radial-gradient(circle, #FFF6CF, #FFE08A); box-shadow: 0 0 0 10px #FFF3C4, 0 10px 0 10px #FFE08A; animation: bounce .8s cubic-bezier(.28,1.6,.5,1) both; margin-bottom: 14px; }

/* ── Onboarding ── */
.screen-onboard { min-height: 100vh; min-height: 100dvh; display: flex; }
.onboard { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); }
.ob-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
.ob-dots i { width: 8px; height: 8px; border-radius: 9px; background: var(--line2); transition: .25s; }
.ob-dots i.on { width: 26px; background: var(--pink); }
.ob-card { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; animation: up2 .35s ease; }
.ob-card h1 { margin: 0; font: 600 30px/1.15 var(--f-disp); }
.ob-card p { margin: 0 0 8px; font-weight: 700; line-height: 1.5; color: var(--ink2); }
.goal-pick { display: grid; gap: 10px; width: 100%; margin-bottom: 8px; }
.gp { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line2); border-bottom-width: 4px; border-radius: 16px; padding: 14px 16px; cursor: pointer; font: 800 16px var(--f-body); color: var(--ink); }
.gp span { font-weight: 700; font-size: 13px; color: var(--muted); }
.gp.on { background: var(--pink-t); border-color: var(--pink); }
.gp em { position: absolute; top: -10px; right: 12px; padding: 3px 7px; border-radius: 8px; background: var(--pink); color: #fff; font: 900 10px var(--f-body); font-style: normal; letter-spacing: .08em; text-transform: uppercase; }
.how { display: grid; gap: 10px; width: 100%; margin: 0 0 8px; padding: 0; list-style: none; text-align: left; }
.how li { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--line2); border-radius: 16px; padding: 12px 14px; font-weight: 700; color: var(--ink2); }
.how span { font-size: 24px; }

/* ── Dad's report ── */
.dad { max-width: var(--w); margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px 32px; }
.dad-top { display: flex; gap: 14px; align-items: center; }
.dad-top h1 { margin: 2px 0; font: 600 28px/1.1 var(--f-disp); }
.dad-top p { margin: 0; font-weight: 700; font-size: 13px; }
.dad-empty { display: grid; justify-items: center; gap: 12px; padding-top: 15vh; text-align: center; }
.dad-empty h1 { margin: 0; font: 600 26px var(--f-disp); }
.dad-skills { display: grid; gap: 16px; }
.dad-unit h4 { margin: 0 0 6px; font: 600 16px var(--f-disp); color: var(--cd); }
.dad-skill { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
.dad-skill small { grid-column: 1 / -1; font-weight: 700; font-size: 12px; color: var(--muted); }
.lvl { align-self: center; padding: 3px 8px; border-radius: 8px; background: #F3E9EF; color: var(--muted); font: 900 11px var(--f-body); }
.lvl1 { background: #FFF1E2; color: #B5651D; }
.lvl2 { background: var(--blue-t); color: var(--blue-d); }
.lvl3 { background: var(--purple-t); color: var(--purple-d); }
.lvl4 { background: #FFF4D6; color: #8A6200; }
.dad .btn { margin-top: 16px; }

/* ── Overlays ── */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }
#toast {
  position: fixed; z-index: 70; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
  max-width: 90vw; padding: 12px 18px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 800; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
}
#toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 370px) {
  .choices.two { grid-template-columns: 1fr; }
  .chip { padding: 6px 4px; }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ══════════ v2: Real-Life mode, strategies, review, unit tests, motion ══════════ */
.story-btn { flex: none; width: 40px; height: 40px; border: 2px solid var(--line2); border-radius: 12px; background: #fff; cursor: pointer; font: 600 22px var(--f-disp); color: var(--muted); display: grid; place-items: center; transition: transform .15s, background .15s; }
.story-btn.on { background: var(--pink-t); border-color: var(--pink); font-size: 22px; }
.story-btn:active { transform: scale(.92); }
.story-btn.off { opacity: .55; cursor: default; font-style: italic; color: var(--ink2); }
.legend-x { display: inline-block; margin: -6px 0 14px; padding: 6px 12px; border-radius: 99px; background: #fff; border: 2px dashed var(--line2); font-weight: 800; font-size: 13px; color: var(--ink2); }
.legend-x i { font-style: normal; color: var(--muted); font-weight: 700; }
.strat-tag { background: var(--orange); color: #fff; border-radius: 8px; padding: 3px 8px; margin-right: 8px; }
.lesson-kind { text-align: center; font: 900 12px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--cd); margin: -2px 0 4px; }
.work { margin: 0 0 16px; padding: 0; list-style: none; display: grid; gap: 8px; }
.work li { display: flex; align-items: center; gap: 12px; background: #fff; border: 2px solid var(--line2); border-radius: 14px; padding: 10px 14px; font: 600 22px var(--f-disp); }
.work li span { flex: none; font: 900 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--cd, var(--orange)); border: 2px solid currentColor; border-radius: 8px; padding: 3px 7px; }

/* Review card + fading nodes */
.review-card { display: flex; align-items: center; gap: 12px; margin: -6px 0 18px; padding: 12px 14px; background: #fff; border: 2px solid #D9C8FF; border-radius: 18px; box-shadow: 0 4px 0 #D9C8FF; animation: up2 .35s; }
.rc-ic { font-size: 28px; }
.rc-main { flex: 1; }
.rc-main b { color: var(--purple-d); }
.rc-main p { margin: 2px 0 0; font-weight: 700; font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.node.fading { filter: saturate(.55); }
.node.fading .node-ring circle { stroke-dasharray: 6 8 !important; }
.fade-tag { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: #fff; border: 2px solid #D9C8FF; font-size: 13px; }

/* Trophy node */
.node.trophy { background: var(--gold); box-shadow: 0 7px 0 var(--gold-d); border-radius: 22px; width: 76px; height: 68px; }
.node.trophy.locked { background: #EFE6EB; box-shadow: 0 7px 0 #DECFD7; }
.node.trophy.passed { outline: 4px solid #FFF3C4; outline-offset: 2px; }
.node.trophy .node-face { font-size: 34px; }

/* Path trail */
.path { position: relative; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--c); opacity: .3; pointer-events: none; z-index: 0; }
.node-row { z-index: 1; }

/* Level-up ring animation */
@keyframes segIn { from { stroke-dasharray: 0 var(--cc); } }
.seg-new { animation: segIn .9s .35s cubic-bezier(.3,1.2,.4,1) both; }
.node.leveled { animation: pop .6s .4s; }
.lu-ring { position: relative; width: 64px; height: 64px; flex: none; }
.lu-ring .node-ring { inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); }
.lu-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; }
.level-up { color: var(--ink); background: var(--ct); border-color: var(--c); }
.lu-lvl { font: 600 20px var(--f-disp); color: var(--cd); }
.up-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-weight: 700; color: var(--ink2); }
.up-row:last-child { border-bottom: 0; }
.up-row span { font-size: 22px; }
.up-row div { flex: 1; }
.up-row b { color: var(--ink); }
.up-row i { font-style: normal; color: var(--green); font-weight: 900; }

/* Daily-goal ring fills in on each render */
@keyframes arcIn { from { stroke-dashoffset: var(--cc); } }
.arc-in { animation: arcIn .9s .1s cubic-bezier(.3,1,.4,1) both; }

/* Streak flame grows with the streak */
.chip-streak .flame { display: inline-block; transform: scale(var(--fs, 1)); transform-origin: 50% 80%; transition: transform .3s; }
.chip-streak.glow .flame { animation: flame 1.4s ease-in-out infinite; filter: drop-shadow(0 0 6px rgba(255,150,64,.6)); }
.big-flame { transform: scale(var(--fs, 1)); }

/* Tab slide */
@keyframes slideL { from { transform: translateX(28px); opacity: 0; } }
@keyframes slideR { from { transform: translateX(-28px); opacity: 0; } }
.view.slide-l { animation: slideL .28s cubic-bezier(.2,.9,.3,1); }
.view.slide-r { animation: slideR .28s cubic-bezier(.2,.9,.3,1); }

/* ON FIRE mode: combo of 5+ */
.lesson.fire { background: linear-gradient(180deg, #FFF8FB 0%, #FFF1E0 100%); animation: heat 2.4s ease-in-out infinite alternate; }
@keyframes heat { to { background: linear-gradient(180deg, #FFF4F8 0%, #FFE6C9 100%); } }
.lesson.fire .combo { font-size: 19px; animation: flame 1s ease-in-out infinite; filter: drop-shadow(0 0 8px rgba(255,150,64,.55)); }
.lesson.fire .bar-fill { background: linear-gradient(90deg, var(--c), var(--orange)); }
.lesson.fire .kiki .k-petals { animation-duration: 3s; }
.lesson.fire .lesson-foot.ok { background: #FFF3DC; border-color: #FFD9A3; }

/* Work-on-next list (SAT tab) */
.next-list { display: grid; gap: 10px; }
.next-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: 2px solid var(--line2); border-left: 6px solid var(--c); border-radius: 16px; padding: 10px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--line2); }
.next-item div { flex: 1; }
.next-item b { font: 800 15px var(--f-body); display: block; }
.next-item small { font-weight: 700; font-size: 12px; color: var(--muted); }
.ni-ic { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: var(--ct); font-size: 22px; }
.ni-go { font: 600 24px var(--f-disp); color: var(--muted); }
.set-row span small { display: block; font-size: 11.5px; font-weight: 700; }

/* Hero glow blob */
.hello { position: relative; }
.hello::before { content: ""; position: absolute; left: -30px; top: -30px; width: 160px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,75,145,.16), transparent 70%); animation: float 4s ease-in-out infinite; pointer-events: none; }

</style>

<body>
<div id="app"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Kiki needs JavaScript turned on.</noscript>
<script>
(() => {
'use strict';
const KK = {};
// ── math.js
KK.math = (() => {
  const MINUS = '−';
  const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const chance = (p) => Math.random() < p;
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) [a, b] = [b, a % b];
    return a || 1;
  }
  const n = (v) => (v < 0 ? MINUS + Math.abs(v) : String(v));
  const paren = (v) => (v < 0 ? `(${n(v)})` : n(v));
  const SUP = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
  const sup = (v) => String(v).split('').map((c) => SUP[c] || c).join('');
  const body = (abs, v) => (v === '' ? String(abs) : abs === 1 ? v : `${abs}${v}`);
  // Leading term of an expression: 3x, −x, 5
  const lead = (c, v = '') => (c === 0 ? (v ? '' : '0') : (c < 0 ? MINUS : '') + body(Math.abs(c), v));
  // Following term: " + 3x", " − 5"; empty when zero
  const term = (c, v = '') => (c === 0 ? '' : ` ${c < 0 ? MINUS : '+'} ${body(Math.abs(c), v)}`);
  function poly(coefs, x = 'x') {
    const deg = coefs.length - 1;
    let out = '';
    coefs.forEach((c, i) => {
      if (!c) return;
      const p = deg - i;
      const v = p === 0 ? '' : p === 1 ? x : x + sup(p);
      out += out ? term(c, v) : lead(c, v);
    });
    return out || '0';
  }
  function frac(a, b) {
    if (b < 0) { a = -a; b = -b; }
    const g = gcd(a, b);
    a /= g; b /= g;
    return b === 1 ? n(a) : `${n(a)}/${b}`;
  }
  function money(v) {
    const abs = Math.abs(v);
    const s = abs.toLocaleString('en-US', {
      minimumFractionDigits: Number.isInteger(abs) ? 0 : 2,
      maximumFractionDigits: 2,
    });
    return (v < 0 ? MINUS : '') + '$' + s;
  }
  const dec = (v) => String(+v.toFixed(2));

  // Grid-in answers: integers, decimals, fractions, negatives.
  function parse(s) {
    s = String(s).trim().replace(/[−–—]/g, '-').replace(/[$,]/g, '');
    const NUM = '-?(?:\\d+\\.?\\d*|\\.\\d+)';
    if (new RegExp(`^${NUM}/${NUM}$`).test(s)) {
      const [a, b] = s.split('/').map(Number);
      return b === 0 ? NaN : a / b;
    }
    if (new RegExp(`^${NUM}$`).test(s)) return Number(s);
    return NaN;
  }
  // Like the SAT: exact value, or a decimal with 3+ places that rounds/truncates to it.
  function gridOk(input, value) {
    const v = parse(input);
    if (!Number.isFinite(v)) return false;
    if (Math.abs(v - value) < 1e-9) return true;
    const s = String(input);
    const places = (s.split('.')[1] || '').replace(/\D/g, '').length;
    return !s.includes('/') && places >= 3 && Math.abs(v - value) < 0.001;
  }

  // Build up to 4 distinct shuffled choices containing the answer.
  function choices(answer, wrongs, max = 4) {
    const set = new Set([answer]);
    for (const w of shuffle(wrongs.slice())) {
      if (set.size >= max) break;
      if (w !== null && w !== undefined && w !== '' && !/NaN|Infinity|undefined/.test(w)) set.add(w);
    }
    const list = shuffle([...set]);
    return { list, idx: list.indexOf(answer) };
  }
  const near = (ans, deltas, fmt = n, ok = () => true) =>
    deltas.map((d) => +(ans + d).toFixed(4)).filter((v) => v !== ans && ok(v)).map(fmt);

  return { MINUS, rand, pick, chance, shuffle, gcd, n, paren, sup, lead, term, poly, frac, money, dec, parse, gridOk, choices, near };
})();

// ── content.js
KK.content = (() => {
  const { MINUS, rand, pick, chance, shuffle, gcd, n, paren, sup, lead, term, poly, frac, money, dec, choices, near } = KK.math;

  // Things Keaton actually buys. Prices are picked so the math comes out clean.
  const ITEMS = [
    { e: '🎀', one: 'bow', many: 'bows', p: [4, 5, 6, 8] },
    { e: '👠', one: 'pair of heels', many: 'pairs of heels', p: [25, 30, 35, 40] },
    { e: '🦋', one: 'butterfly clip', many: 'butterfly clips', p: [2, 3, 4] },
    { e: '👗', one: 'dress', many: 'dresses', p: [20, 25, 30, 35] },
    { e: '💄', one: 'lip gloss', many: 'lip glosses', p: [6, 8, 10, 12] },
    { e: '👟', one: 'pair of sneakers', many: 'pairs of sneakers', p: [45, 50, 60] },
    { e: '💅', one: 'nail polish', many: 'nail polishes', p: [5, 7, 9] },
    { e: '👜', one: 'bag', many: 'bags', p: [15, 20, 25] },
    { e: '🥤', one: 'smoothie', many: 'smoothies', p: [5, 6, 7] },
  ];
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const tok = (it, k) =>
    `<span class="tok" role="img" aria-label="${k} ${k === 1 ? it.one : it.many}">${k <= 5 ? it.e.repeat(k) : `${k}×${it.e}`}</span>`;
  const op = (s) => `<span class="op">${s}</span>`;
  const cash = (v) => `<span class="cash">${money(v)}</span>`;
  const eqv = (...parts) => `<div class="eqv">${parts.join('')}</div>`;
  const eq = (s) => `<div class="eq">${s}</div>`;
  const think = (s) => `<div class="think">${s}</div>`;
  function make(p) {
    const { wrongs, ...rest } = p;
    const { list, idx } = choices(p.answer, wrongs || []);
    return { ...rest, choices: list, correct: idx };
  }
  function twoItems(cheapFirst) {
    let A, B;
    do { [A, B] = shuffle(ITEMS.slice()).slice(0, 2); } while (cheapFirst && A.p[A.p.length - 1] >= B.p[0]);
    return [A, B];
  }

  const TRIPLES = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25]];
  function triple() {
    const t = pick(TRIPLES);
    const k = t[2] === 5 ? rand(1, 3) : 1;
    const [a, b, c] = t.map((v) => v * k);
    return chance(0.5) ? [a, b, c] : [b, a, c];
  }
  // Right triangle: v = vertical leg, h = horizontal leg, c = hypotenuse; θ sits at the bottom-right corner.
  function tri({ v, h, c, angle = false }) {
    return `<svg class="tri" viewBox="0 0 200 142" role="img" aria-label="Right triangle: vertical side ${v}, bottom side ${h}, long side ${c}">
      <polygon points="30,20 30,120 180,120" fill="#FFF0F6" stroke="#FF4B91" stroke-width="4" stroke-linejoin="round"/>
      <rect x="30" y="104" width="16" height="16" fill="none" stroke="#FF4B91" stroke-width="3"/>
      ${angle ? '<path d="M152 120 A28 28 0 0 1 157 104" fill="none" stroke="#9B6BFF" stroke-width="3"/><text x="138" y="116" class="tl ang">θ</text>' : ''}
      <text x="14" y="76" class="tl" text-anchor="middle">${v}</text>
      <text x="105" y="140" class="tl" text-anchor="middle">${h}</text>
      <text x="120" y="62" class="tl" text-anchor="middle">${c}</text>
    </svg>`;
  }

  const FLIP = { '>': '<', '<': '>', '≥': '≤', '≤': '≥' };

  const PCTX = [
    { title: '🍗 Birdies orders tonight', rows: ['Tenders', 'Wings'], cols: ['Mild', 'Spicy'], who: 'order', pron: 'it',
      rowIs: ['is tenders', 'is wings'], colIs: ['is mild', 'is spicy'],
      colGroup: ['mild orders', 'spicy orders'], rowAre: ['tenders', 'wings'] },
    { title: '🎀 Cheer squad hair survey', rows: ['Juniors', 'Seniors'], cols: ['Bows', 'Scrunchies'], who: 'cheerleader', pron: 'they',
      rowIs: ['is a junior', 'is a senior'], colIs: ['picked bows', 'picked scrunchies'],
      colGroup: ['cheerleaders who picked bows', 'cheerleaders who picked scrunchies'], rowAre: ['juniors', 'seniors'] },
  ];
  function twoWay() {
    const ctx = pick(PCTX);
    const m = [[rand(3, 15), rand(3, 15)], [rand(3, 15), rand(3, 15)]];
    const rowT = [m[0][0] + m[0][1], m[1][0] + m[1][1]];
    const colT = [m[0][0] + m[1][0], m[0][1] + m[1][1]];
    const T = rowT[0] + rowT[1];
    const html = `<table class="tbl"><caption>${ctx.title}</caption>
      <thead><tr><th></th><th>${ctx.cols[0]}</th><th>${ctx.cols[1]}</th><th>Total</th></tr></thead>
      <tbody>
        <tr><th>${ctx.rows[0]}</th><td>${m[0][0]}</td><td>${m[0][1]}</td><td>${rowT[0]}</td></tr>
        <tr><th>${ctx.rows[1]}</th><td>${m[1][0]}</td><td>${m[1][1]}</td><td>${rowT[1]}</td></tr>
        <tr class="tot"><th>Total</th><td>${colT[0]}</td><td>${colT[1]}</td><td>${T}</td></tr>
      </tbody></table>`;
    return { ctx, m, rowT, colT, T, html };
  }

  const SKILLS = [
    // ───────── Unit 1: Algebra ─────────
    {
      id: 'lin', story: true, unit: 'alg', icon: '🎀', name: 'Linear equations', blurb: 'Solve for x, the #1 thing on the SAT.',
      gen: {
        easy() {
          const it = pick(ITEMS), x = pick(it.p), k = rand(2, 5);
          const [fee, what] = pick([[3, 'shipping fee'], [4, 'gift box'], [5, 'shipping fee'], [2, 'tote bag'], [6, 'gift wrap']]);
          const T = k * x + fee;
          return make({
            label: `How much is one ${it.e}?`,
            prompt: `You buy ${k} ${it.many} plus a ${money(fee)} ${what}. You pay ${money(T)} total. How much is one ${it.one}?`,
            visual: eqv(tok(it, k), op('+'), cash(fee), op('='), cash(T)),
            answer: money(x), value: x, unit: '$',
            wrongs: [...near(x, [-2, -1, 1, 2, 3], money, (v) => v > 0), money(+(T / k).toFixed(2)), money(T - fee)],
            steps: [
              `Take away the ${what}: ${k} ${it.e} = ${money(T)} − ${money(fee)} = ${money(T - fee)}`,
              `Split it ${k} ways: one ${it.e} = ${money(T - fee)} ÷ ${k} = <b>${money(x)}</b>`,
            ],
            hint: `First take the ${money(fee)} ${what} out of the total.`,
            bridge: `In algebra: <b>${k}x + ${fee} = ${T}</b>, where <b>x</b> = one ${it.e}. Same problem!`,
          });
        },
        medium() {
          const a = rand(2, 7);
          let c = rand(-5, 6);
          while (c === a || c === 0) c = rand(-5, 6);
          const x = rand(-6, 9), b = rand(-9, 9) || 4, d = a * x + b - c * x;
          return make({
            label: 'Solve for x',
            prompt: 'Find the value of <i>x</i>.',
            visual: eq(`${lead(a, 'x')}${term(b)} = ${lead(c, 'x')}${term(d)}`),
            answer: `x = ${n(x)}`, value: x,
            wrongs: near(x, [-3, -2, -1, 1, 2, 3], (v) => `x = ${n(v)}`),
            steps: [
              `Move ${lead(c, 'x')} to the left side: ${lead(a - c, 'x')}${term(b)} = ${n(d)}`,
              `Undo the${term(b)}: ${lead(a - c, 'x')} = ${n(d - b)}`,
              `Divide by ${n(a - c)}: <b>x = ${n(x)}</b>`,
            ],
            hint: 'Collect the x’s on one side and the plain numbers on the other.',
          });
        },
        hard() {
          if (chance(0.4)) {
            const a = rand(2, 6), b = rand(1, 9), x = rand(2, 9), m = pick([2, 3, 4]), T = a * x + b;
            return make({
              label: 'SAT shortcut',
              prompt: `If ${a}x + ${b} = ${T}, what is the value of ${a * m}x + ${b * m}?`,
              answer: n(T * m), value: T * m,
              wrongs: [n(x), n(T), n(x * m), ...near(T * m, [-m, m, b])],
              steps: [`Notice ${a * m}x + ${b * m} = ${m}(${a}x + ${b}).`, `So it equals ${m} × ${T} = <b>${T * m}</b>. No need to find x!`],
              hint: `Compare ${a * m}x + ${b * m} with ${a}x + ${b}. Spot the pattern?`,
            });
          }
          let a, b;
          do { a = rand(2, 6); b = rand(2, 6); } while (a === b);
          const p = rand(-6, 6) || 2, q = rand(-6, 6) || -3, x = rand(-6, 7);
          const r = (a - b) * x + a * p - b * q;
          return make({
            label: 'Solve for x',
            prompt: 'Find the value of <i>x</i>.',
            visual: eq(`${a}(x${term(p)}) = ${b}(x${term(q)})${term(r)}`),
            answer: `x = ${n(x)}`, value: x,
            wrongs: near(x, [-3, -2, -1, 1, 2, 4], (v) => `x = ${n(v)}`),
            steps: [
              `Distribute: ${a}x${term(a * p)} = ${b}x${term(b * q)}${term(r)}`,
              `Collect like terms: ${lead(a - b, 'x')} = ${n(b * q + r - a * p)}`,
              `Divide by ${n(a - b)}: <b>x = ${n(x)}</b>`,
            ],
            hint: 'Distribute first: multiply the outside number into everything in the parentheses.',
          });
        },
      },
    },
    {
      id: 'ineq', story: true, unit: 'alg', icon: '⚖️', name: 'Inequalities', blurb: 'Budgets, limits, and the sign-flip trap.',
      gen: {
        easy() {
          const it = pick(ITEMS.filter((i) => i.p[0] <= 10)), p = pick(it.p);
          const f = pick([4, 5, 6, 8]), B = pick([40, 50, 60, 75]);
          const k = Math.floor((B - f) / p);
          return make({
            label: `How many ${it.e} can you get?`,
            prompt: `You have ${money(B)}. ${cap(it.many)} cost ${money(p)} each, plus ${money(f)} shipping. What’s the most ${it.many} you can buy?`,
            visual: eqv(`<span class="tok">?×${it.e}</span>`, op('+'), cash(f), op('≤'), cash(B)),
            answer: String(k), value: k,
            wrongs: [String(k + 1), String(k - 1), String(Math.floor(B / p)), String(k + 2)],
            steps: [
              `Spend at most ${money(B)}: ${p}x + ${f} ≤ ${B}`,
              `Take away shipping: ${p}x ≤ ${B - f}`,
              `Divide: x ≤ ${dec((B - f) / p)}`,
              `You can’t buy part of one, so round <b>down</b>: <b>${k}</b>`,
            ],
            hint: 'Take out shipping first. Then see how many fit in what’s left.',
            bridge: `In algebra: <b>${p}x + ${f} ≤ ${B}</b>, where <b>x</b> = number of ${it.e}.`,
          });
        },
        medium() {
          const a = rand(2, 6), k = rand(-5, 8), b = rand(-9, 9) || 3, s = pick(Object.keys(FLIP)), c = a * k + b;
          return make({
            label: 'Solve the inequality',
            prompt: 'Which values of <i>x</i> work?',
            visual: eq(`${a}x${term(b)} ${s} ${n(c)}`),
            answer: `x ${s} ${n(k)}`,
            wrongs: [`x ${FLIP[s]} ${n(k)}`, `x ${s} ${frac(c + b, a)}`, `x ${s} ${n(c - b)}`, `x ${s} ${n(k + 1)}`],
            steps: [`Undo the${term(b)}: ${a}x ${s} ${n(c - b)}`, `Divide by ${a}. It’s positive, so the sign stays: <b>x ${s} ${n(k)}</b>`],
            hint: 'Solve it like an equation. Dividing by a positive number keeps the sign.',
          });
        },
        hard() {
          const a = rand(2, 6), k = rand(-5, 8), b = rand(-9, 9) || 5, s = pick(Object.keys(FLIP)), c = -a * k + b;
          return make({
            label: 'Watch the sign',
            prompt: 'Careful with this one. Which values of <i>x</i> work?',
            visual: eq(`${n(b)}${term(-a, 'x')} ${s} ${n(c)}`),
            answer: `x ${FLIP[s]} ${n(k)}`,
            wrongs: [`x ${s} ${n(k)}`, `x ${FLIP[s]} ${n(-k)}`, `x ${s} ${n(-k)}`, `x ${FLIP[s]} ${n(k + 1)}`],
            steps: [
              `Undo the ${n(b)}: ${lead(-a, 'x')} ${s} ${n(c - b)}`,
              `Divide by ${n(-a)}. ⚠️ Dividing by a negative <b>flips</b> the sign!`,
              `<b>x ${FLIP[s]} ${n(k)}</b>`,
            ],
            hint: 'Multiplying or dividing by a negative flips the inequality sign.',
          });
        },
      },
    },
    {
      id: 'linfn', unit: 'alg', icon: '📈', name: 'Lines & slope', blurb: 'Slope, rates, and what the numbers mean.',
      gen: {
        easy() {
          if (chance(0.5)) {
            const w = pick([11, 12, 13, 14, 15]), t = pick([30, 40, 50, 60]), h = rand(3, 8), P = w * h + t;
            return make({
              label: 'Birdies payday 🍗',
              prompt: `At Birdies you earn ${money(w)} an hour plus about ${money(t)} in tips each shift. Your pay for an <i>h</i>-hour shift is P(h) = ${w}h + ${t}. What is P(${h})?`,

            wrongs: [String(ans * 2), String(Math.round(ans / 2)), String(ans * 4), String(ans + 70)],
            steps: [`Round both: ${a} ≈ ${ra} and ${b} ≈ ${rb === 1 / 3 ? '⅓' : rb}.`, `${ra} × ${rb === 1 / 3 ? '⅓' : rb} = ${ans}.`, `Closest choice: <b>${ans}</b>. Cross out anything far from that.`],

      },
    },
    {
      id: 'mistake', unit: 'str', icon: '🕵️', name: 'Spot the mistake', blurb: 'Find the wrong step. Harder than it sounds.',
      gen: {
        easy() { return mistakeProblem('easy'); },
        medium() { return mistakeProblem('medium'); },
        hard() { return mistakeProblem('hard'); },
      },
    },
  ];

  // Builds a worked solution with (usually) one wrong step. Later steps follow from the error, so only one step is at fault.
  const workHTML = (lines) => `<ol class="work">${lines.map((l, i) => `<li><span>Step ${i + 1}</span>${l}</li>`).join('')}</ol>`;
  function mistakeProblem(level) {
    const none = chance(0.2);
    let eqn, lines, bad, why, fix;
    if (level === 'easy') {
      const a = rand(2, 6), p = rand(1, 6), x = rand(1, 8), c = a * (x + p);
      eqn = `${a}(x + ${p}) = ${c}`;
      const kind = none ? 0 : rand(1, 3);
      if (kind === 1) {
        lines = [`${a}x + ${p} = ${c}`, `${a}x = ${c - p}`, `x = ${frac(c - p, a)}`];
        why = `Step 1 only multiplied the x by ${a}. The ${a} has to multiply <b>both</b> things inside: ${a}x + ${a * p}.`;
      } else if (kind === 2) {
        lines = [`${a}x + ${a * p} = ${c}`, `${a}x = ${c + a * p}`, `x = ${frac(c + a * p, a)}`];
        why = `Step 2 added ${a * p} instead of subtracting it. To undo “+ ${a * p}”, subtract: ${a}x = ${c - a * p}.`;
      } else if (kind === 3) {
        lines = [`${a}x + ${a * p} = ${c}`, `${a}x = ${c - a * p}`, `x = ${c - a * p - a}`];
        why = `Step 3 subtracted ${a} instead of dividing by ${a}. ${c - a * p} ÷ ${a} = ${x}.`;
      } else {
        lines = [`${a}x + ${a * p} = ${c}`, `${a}x = ${c - a * p}`, `x = ${x}`];
      }
      bad = kind; fix = `x = ${x}`;
    } else if (level === 'medium') {
      const a = rand(4, 8), c = rand(2, a - 2), x = rand(-4, 7), b = rand(1, 9), d = (a - c) * x + b;
      const m = a - c, L = (k, v) => lead(k, v);
      eqn = `${a}x + ${b} = ${L(c, 'x')}${term(d)}`;
      const kind = none ? 0 : rand(1, 3);
      if (kind === 1) {
        lines = [`${L(a + c, 'x')} + ${b}${term(0)} = ${n(d)}`, `${L(a + c, 'x')} = ${n(d - b)}`, `x = ${frac(d - b, a + c)}`];
        why = `Step 1 moved ${L(c, 'x')} to the left but didn’t flip its sign. Subtracting ${L(c, 'x')} from both sides gives ${L(m, 'x')} + ${b} = ${n(d)}.`;
      } else if (kind === 2) {
        lines = [`${L(m, 'x')} + ${b} = ${n(d)}`, `${L(m, 'x')} = ${n(d + b)}`, `x = ${frac(d + b, m)}`];
        why = `Step 2 added ${b} to the right side. To undo “+ ${b}” you subtract: ${L(m, 'x')} = ${n(d - b)}.`;
      } else if (kind === 3) {
        lines = [`${L(m, 'x')} + ${b} = ${n(d)}`, `${L(m, 'x')} = ${n(d - b)}`, `x = ${n(d - b - m)}`];
        why = `Step 3 subtracted ${m} instead of dividing. ${n(d - b)} ÷ ${m} = ${n(x)}.`;
      } else {
        lines = [`${L(m, 'x')} + ${b} = ${n(d)}`, `${L(m, 'x')} = ${n(d - b)}`, `x = ${n(x)}`];
      }
      bad = kind; fix = `x = ${n(x)}`;
    } else {
      const a = rand(2, 5), k = rand(-4, 6), b = rand(1, 9), c = -a * k + b, s = pick(['<', '>']);
      eqn = `${b} − ${a}x ${s} ${n(c)}`;
      const kind = none ? 0 : rand(1, 3);
      const flip = FLIP[s];
      if (kind === 1) {
        lines = [`−${a}x ${s} ${n(c + b)}`, `x ${flip} ${frac(c + b, -a)}`];
        why = `Step 1 added ${b} instead of subtracting it. Undo “${b} −” by subtracting ${b}: −${a}x ${s} ${n(c - b)}.`;
      } else if (kind === 2) {
        lines = [`−${a}x ${s} ${n(c - b)}`, `x ${s} ${n(k)}`];
        why = `Step 2 divided by −${a} but kept the sign. Dividing by a negative <b>flips</b> it: x ${flip} ${n(k)}.`;
      } else if (kind === 3) {
        lines = [`−${a}x ${s} ${n(c - b)}`, `x ${flip} ${n(-k)}`];
        why = `Step 2 flipped the sign (good!) but dropped the negative when dividing. ${n(c - b)} ÷ (−${a}) = ${n(k)}.`;
      } else {
        lines = [`−${a}x ${s} ${n(c - b)}`, `x ${flip} ${n(k)}`];
      }
      bad = kind === 3 ? 2 : kind; fix = `x ${flip} ${n(k)}`;
    }
    const opts = lines.map((_, i) => `Step ${i + 1}`).concat('No mistake');
    const answer = bad ? `Step ${bad}` : 'No mistake';
    return {
      label: 'Spot the mistake', strategy: true,
      prompt: `Kiki solved <b>${eqn}</b>. Which step is the <b>first</b> mistake?`,
      visual: workHTML(lines),
      choices: opts, correct: opts.indexOf(answer), answer,
      steps: bad ? [why, `Done right, the answer is <b>${fix}</b>.`] : ['Every step is correct.', `The answer really is <b>${fix}</b>. Nice eye.`],
      hint: 'Check each step against the one before it. What operation did they do to both sides?',

  }
  function legend() {

  }

  const UNITS = [
    { id: 'alg', name: 'Algebra', sat: 'Algebra', blurb: 'Equations, inequalities, lines & systems', color: '#FF4B91', dark: '#D63375', tint: '#FFE4EF' },
    { id: 'adv', name: 'Advanced Math', sat: 'Advanced Math', blurb: 'Functions, quadratics, exponents & more', color: '#9B6BFF', dark: '#7A4BE0', tint: '#EFE7FF' },
    { id: 'psda', name: 'Data & Percents', sat: 'Problem-Solving & Data', blurb: 'Percents, rates, stats & probability', color: '#22C483', dark: '#169E68', tint: '#DDF8EC' },
    { id: 'geo', name: 'Geometry & Trig', sat: 'Geometry & Trig', blurb: 'Triangles, trig, circles, area & volume', color: '#1CB0F6', dark: '#1590CF', tint: '#DDF2FD' },
    { id: 'str', name: 'Test Strategies', sat: 'Score boosters', blurb: 'Backsolve, plug in, ballpark, and catch mistakes', color: '#FF9640', dark: '#D9731F', tint: '#FFEBDD', strategy: true },
  ];
  const LEVELS = {
    easy: { name: 'Warm-Up', xp: 10, desc: 'Real-life stories with 🎀 and 👠' },
    medium: { name: 'Full Face', xp: 15, desc: 'Regular x’s. You’ve got this.' },
    hard: { name: 'Runway', xp: 20, desc: 'SAT-level and trickier' },
  };

  const skillById = Object.fromEntries(SKILLS.map((s) => [s.id, s]));
  const unitById = Object.fromEntries(UNITS.map((u) => [u.id, u]));

  function problem(id, level) {
    const s = skillById[id];
    return { ...s.gen[level](), skill: id, level, domain: s.unit };
  }

  return { SKILLS, UNITS, LEVELS, MASTERY, skillById, unitById, problem, ITEMS, storyify, legend };
})();

KK.store = (() => {

    { id: 'lessons', icon: '🌸', text: () => 'Finish 2 lessons', target: () => 2, prog: (d) => d.lessons },
    { id: 'combo', icon: '🔥', text: () => 'Get 5 right in a row', target: () => 5, prog: (d) => d.combo },

  function checkBadges() {

// ── sound.js
KK.sound = (() => {
  // Every sound is synthesized with Web Audio: no files, works offline, tiny.
  let ac = null;
  let on = true;
  function ctx() {
    if (!on) return null;
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ac = new C();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, at, dur, { type = 'sine', vol = 0.15, to = null } = {}) {
    const a = ctx();
    if (!a) return;
    const t = a.currentTime + at;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  const buzz = (ms) => { try { if (on && navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* unsupported */ } };

  return {
    set enabled(v) { on = !!v; },
    get enabled() { return on; },
    unlock() { ctx(); },
    tap() { tone(560, 0, 0.05, { vol: 0.05, to: 420 }); },
    pop() { tone(950, 0, 0.09, { vol: 0.2, to: 170 }); },
    correct(combo = 0) {
      const lift = Math.pow(2, Math.min(combo, 8) / 12);
      tone(950, 0, 0.08, { vol: 0.16, to: 200 });
      tone(784 * lift, 0.05, 0.16, { type: 'triangle', vol: 0.13 });
      tone(1175 * lift, 0.12, 0.26, { type: 'triangle', vol: 0.12 });
      buzz(18);
    },
    wrong() {
      tone(262, 0, 0.18, { vol: 0.12, to: 196 });
      tone(185, 0.13, 0.26, { vol: 0.1, to: 140 });
      buzz([30, 40, 30]);
    },
    fanfare() {
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.3, { type: 'triangle', vol: 0.12 }));
      [0.05, 0.17, 0.29].forEach((t) => tone(1400, t, 0.06, { vol: 0.06, to: 300 }));
    },
    coin() { tone(1319, 0, 0.08, { type: 'square', vol: 0.05 }); tone(1760, 0.07, 0.18, { type: 'square', vol: 0.05 }); },
  };
})();

// ── fx.js
KK.fx = (() => {
  // Canvas particle system: little flowers that pop, spin, fall and fade.
  const COLORS = ['#FF4B91', '#FF8CC0', '#FFC53D', '#9B6BFF', '#22C483', '#1CB0F6', '#FF9640'];
  let cv = null, g = null, parts = [], raf = 0, dpr = 1;
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function init(canvas) {
    cv = canvas;
    g = cv.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
  }
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr;
    cv.height = innerHeight * dpr;
  }
  function flower(x, y, opts = {}) {
    const a = opts.angle ?? Math.random() * Math.PI * 2;
    const sp = (opts.speed ?? 5) * (0.55 + Math.random() * 0.8);
    parts.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - (opts.lift ?? 3.5),
      r: (opts.size ?? 9) * (0.7 + Math.random() * 0.7),
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
      petals: Math.random() < 0.5 ? 5 : 6,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      life: 0, max: (opts.life ?? 70) + Math.random() * 30,
      g: opts.gravity ?? 0.22,
    });
  }
  function burst(x, y, count = 14, opts = {}) {
    if (!g) return;
    if (reduced()) count = Math.min(count, 3);
    for (let i = 0; i < count; i++) flower(x, y, opts);
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function shower(count = 40) {
    if (!g) return;
    if (reduced()) return;
    for (let i = 0; i < count; i++) {
      flower(Math.random() * innerWidth, -20 - Math.random() * 120, { angle: Math.PI / 2, speed: 1.5, lift: 0, size: 11, life: 160, gravity: 0.05 });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  }
  function draw(p) {
    const t = p.life / p.max;
    const s = p.life < 9 ? 1.25 * Math.sin((p.life / 9) * Math.PI * 0.75) + 0.05 : 1;
    g.save();
    g.globalAlpha = t > 0.7 ? 1 - (t - 0.7) / 0.3 : 1;
    g.translate(p.x * dpr, p.y * dpr);
    g.rotate(p.rot);
    g.scale(s * dpr, s * dpr);
    g.fillStyle = p.color;
    for (let k = 0; k < p.petals; k++) {
      const a = (k / p.petals) * Math.PI * 2;
      g.beginPath();
      g.ellipse(Math.cos(a) * p.r * 0.62, Math.sin(a) * p.r * 0.62, p.r * 0.56, p.r * 0.36, a, 0, Math.PI * 2);
      g.fill();
    }
    g.fillStyle = p.color === '#FFC53D' ? '#fff' : '#FFE27A';
    g.beginPath();
    g.arc(0, 0, p.r * 0.36, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }
  function loop() {
    g.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter((p) => p.life < p.max);
    for (const p of parts) {
      p.life++;
      p.vy += p.g;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      draw(p);
    }
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if (!raf) g.clearRect(0, 0, cv.width, cv.height);
  }
  function burstFrom(el, count, opts) {
    if (!el) return burst(innerWidth / 2, innerHeight / 2, count, opts);
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, count, opts);
  }
  function clear() { parts = []; if (g) g.clearRect(0, 0, cv.width, cv.height); }
  return { init, burst, burstFrom, shower, clear };
})();

      redos: 0, base: n, start: Date.now(), answered: new Array(n).fill(null), legend: C.legend(), ...base };

    render();

  function startLesson(id) {

    newLesson({ kind: 'skill', id, ids: [id], unit: s.unit, title: s.name, qs, allowRedo: true });
  }
  function startReview() {
    const ids = S.reviewDue();

  }
  const useStory = (p) => !!(S.s.story && skillById[p.skill].story && p.level !== 'hard' && !p.strategy && lesson && lesson.kind !== 'unit');
  const hintItems = (p) => [p.hint, ...p.steps.slice(0, -1)].filter(Boolean);
  function hintHTML(p, k, show) { return k ? `<ul>${hintItems(p).slice(0, k).map((h) => `<li>💡 ${show(h)}</li>`).join('')}</ul>` : ''; }
  function choicesHTML(p, sel, numbered, show = (h) => h) {

  function setCheckReady(on) { const b = $('[data-act="check"]'); if (b) b.disabled = !on; }

    else if (k === '/') { if (/\d$/.test(v) && !v.includes('/')) v += '/'; }
    else if (k === '.') { if (!v.split('/').pop().includes('.')) v += '.'; }
    else if (/^\d$/.test(k) && v.replace(/[-]/g, '').length < 7) v += k;

  }
  function hint() {
    const L = lesson, p = L.qs[L.i];

    if (!L.usedHint) L.hints++;
    L.hint++; L.usedHint = true;
    $('#hints').innerHTML = hintHTML(p, L.hint, useStory(p) ? (h) => C.storyify(h, L.legend) : (h) => h);

  function check() {
    const L = lesson, p = L.qs[L.i];
    if (L.phase !== 'answer') return;
    const ready = p.type === 'grid' ? /\d/.test(L.input) : L.sel !== null;
    if (!ready) return;
    const ok = p.type === 'grid' ? M.gridOk(L.input, p.value) : L.sel === p.correct;
    L.phase = 'feedback';
    L.answered[L.i] = ok;
    const sk = S.skill(p.skill);
    sk.total++;
    let gained = 0, line;
    if (ok) {
      sk.correct++;
      if (!L.usedHint) L.combo++;
      L.maxCombo = Math.max(L.maxCombo, L.combo);
      if (!p.redo) L.firstTry++;
      gained = p.redo ? 5 : LEVELS[p.level].xp;
      if (L.usedHint) gained = Math.ceil(gained / 2);
      if (L.combo >= 3) gained += 5;
      L.xp += gained;
      line = L.combo >= 8 ? say('combo8') : L.combo >= 5 ? say('combo5') : L.combo === 3 ? say('combo3') : say('correct');
    } else {
      L.combo = 0; L.wrongs++;
      line = say('wrong');
      if (L.allowRedo && !p.redo && L.redos < 2) {
        const np = prep(C.problem(p.skill, p.level), p.type === 'grid' ? 1 : 0);
        np.redo = true;
        L.qs.push(np); L.answered.push(null); L.redos++;
        line += ' You’ll get a redo at the end 🔁';
      }
    }
    S.save();
    if (p.type === 'mc') {
      $$('.choice').forEach((b, i) => { b.disabled = true; if (i === p.correct) b.classList.add('right'); else if (i === L.sel) b.classList.add('wrong'); });
    } else {
      $('#gdisp').classList.add(ok ? 'right' : 'wrong');
      $$('.key').forEach((b) => { b.disabled = true; });
    }
    $('#qkiki').innerHTML = me(ok ? 'cheer' : 'oops', 72, ok ? 'bounce' : 'wiggle');
    const combo = $('.combo');
    combo.className = `combo ${L.combo >= 2 ? 'on' : ''} ${ok && L.combo >= 2 ? 'bump' : ''}`;
    combo.querySelector('b').textContent = L.combo;
    $('.lesson').classList.toggle('fire', L.combo >= 5);
    $('.bar-fill').style.width = `${(100 * (L.i + 1)) / L.qs.length}%`;
    const foot = $('#foot');
    foot.className = `lesson-foot ${ok ? 'ok' : 'no'}`;
    foot.innerHTML = footFeedback(ok, p, line, gained);
    if (ok) {
      snd.correct(L.combo);
      fx.burstFrom(p.type === 'mc' ? $$('.choice')[p.correct] : $('#gdisp'), 10 + Math.min(L.combo, 8) * 3, { speed: 6 + Math.min(L.combo, 8) * 0.4 });

  function next() {

  function finishLesson() {
    const L = lesson;
    const acc = L.firstTry / L.base, perfect = L.wrongs === 0 && L.hints === 0;
    let xp = L.xp + (perfect ? 10 : 0), gems = perfect ? 10 : 5;
    const steps = [];
    const common = { acc, secs: Math.round((Date.now() - L.start) / 1000), perfect };
    if (L.kind === 'skill') {
      const sk = S.skill(L.id), before = sk.level;
      let after = before;
      if (before === 0) after = acc >= 0.8 ? 2 : 1;
      else if (acc >= 0.8 && before < 4) after = before + 1;
      sk.level = after;
      S.touch(L.id);
      if (after > before) justLeveled = { id: L.id, level: after };
      steps.push({ type: 'lesson', xp, gems, before, after, skill: L.id, title: perfect ? 'Perfect lesson!' : 'Lesson complete!', ...common });
    } else if (L.kind === 'review') {
      xp += 20;
      L.ids.forEach((id) => S.touch(id));
      steps.push({ type: 'lesson', xp, gems, before: 0, after: 0, skill: L.ids[0], title: 'Touch-up done!', sub: `${L.ids.length} skill${L.ids.length > 1 ? 's' : ''} back to sharp ✨`, ...common });
    } else {
      const per = {};
      L.qs.forEach((p, i) => { const r = per[p.skill] || (per[p.skill] = { right: 0, total: 0 }); r.total++; if (L.answered[i]) r.right++; });
      const ups = S.applyUnitTest(L.id, per, acc);
      const passed = acc >= 0.8;
      xp += passed ? 150 : 50; gems += passed ? 20 : 0;
      if (ups.length) justLeveled = { id: ups[0].id, level: ups[0].level };
      steps.push({ type: 'unit', xp, gems, unit: L.id, ups, passed, per, ...common });

    d.lessons++;
    d.combo = Math.max(d.combo, L.maxCombo);
    if (perfect) d.perfects++;
    if (L.unit === 'psda' || L.unit === 'geo') d.gd++;
    S.s.bestCombo = Math.max(S.s.bestCombo, L.maxCombo);
    S.s.gems += gems;
    const goalHit = S.addXP(xp);
    const streak = S.extendStreak();
    const quests = S.claimQuests(), badges = S.checkBadges();
    S.save();
    if (streak.extended) steps.push({ type: 'streak', used: streak.used });
    if (goalHit || quests.length) steps.push({ type: 'quests', goalHit, quests });

  function openLayer(html) {
